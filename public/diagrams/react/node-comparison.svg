<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 140" fill="none">
  <rect x="0" y="0" width="200" height="140" rx="5" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="100" y="18" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#fca5a5">Real DOM Node</text>
  <text x="10" y="36" font-size="9" font-family="monospace" fill="#cbd5e1">{</text>
  <text x="18" y="50" font-size="9" font-family="monospace" fill="#94a3b8">type: "div",</text>
  <text x="18" y="62" font-size="9" font-family="monospace" fill="#94a3b8">tagName: "DIV",</text>
  <text x="18" y="74" font-size="9" font-family="monospace" fill="#94a3b8">className: "cont",</text>
  <text x="18" y="86" font-size="9" font-family="monospace" fill="#94a3b8">childNodes: [...],</text>
  <text x="18" y="98" font-size="9" font-family="monospace" fill="#94a3b8">parentNode: ...,</text>
  <text x="18" y="110" font-size="9" font-family="monospace" fill="#94a3b8">style: ..., dataset: ...,</text>
  <text x="10" y="126" font-size="9" font-family="monospace" fill="#ef4444">...200+ properties</text>
  <text x="10" y="136" font-size="9" font-family="monospace" fill="#cbd5e1">}</text>

  <text x="220" y="75" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#475569">vs</text>

  <rect x="235" y="0" width="205" height="140" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="337" y="18" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#86efac">Virtual DOM Node</text>
  <text x="245" y="36" font-size="9" font-family="monospace" fill="#cbd5e1">{</text>
  <text x="255" y="52" font-size="9" font-family="monospace" fill="#fbbf24">type</text>
  <text x="282" y="52" font-size="9" font-family="monospace" fill="#cbd5e1">: "div",</text>
  <text x="255" y="68" font-size="9" font-family="monospace" fill="#60a5fa">props</text>
  <text x="282" y="68" font-size="9" font-family="monospace" fill="#cbd5e1">: { className: "container" },</text>
  <text x="255" y="84" font-size="9" font-family="monospace" fill="#4ade80">children</text>
  <text x="300" y="84" font-size="9" font-family="monospace" fill="#cbd5e1">: [...]</text>
  <text x="245" y="100" font-size="9" font-family="monospace" fill="#cbd5e1">}</text>
  <text x="255" y="126" font-size="8" font-family="monospace" fill="#22c55e">Lightweight — sirf what matters</text>
