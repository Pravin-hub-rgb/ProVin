<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 608 680" role="img" aria-labelledby="title desc" focusable="false">
  <title id="title">Phase 3 opening position 3: Ruy Lopez pawn response</title>
  <desc id="desc">Accessible White-perspective chess board with a1 at bottom-left. Side to move: Black. FEN: r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3. Uppercase letters are White pieces and lowercase letters are Black pieces.</desc>
  <rect width="608" height="680" fill="#0f172a"/>
  <text x="304" y="25" text-anchor="middle" fill="#f8fafc" font-size="15" font-family="Arial, sans-serif" font-weight="700">Opening Position 3</text>
  <text x="304" y="48" text-anchor="middle" fill="#93c5fd" font-size="12" font-family="Arial, sans-serif">Side to move: Black | White perspective | a1 bottom-left</text>
  <g transform="translate(48 72)">
    <defs>
      <pattern id="board" width="128" height="128" patternUnits="userSpaceOnUse">
        <rect width="128" height="128" fill="#f8fafc"/>
        <rect width="64" height="64" fill="#475569"/>
        <rect x="64" y="64" width="64" height="64" fill="#475569"/>
      </pattern>
    </defs>
    <rect width="512" height="512" fill="url(#board)" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512" fill="none" stroke="#cbd5e1" stroke-opacity="0.55" stroke-width="1"/>
    <g fill="#cbd5e1" font-size="13" font-family="Arial, sans-serif" text-anchor="end" dominant-baseline="middle">
      <text x="-14" y="32">8</text><text x="-14" y="96">7</text><text x="-14" y="160">6</text><text x="-14" y="224">5</text><text x="-14" y="288">4</text><text x="-14" y="352">3</text><text x="-14" y="416">2</text><text x="-14" y="480">1</text>
    </g>
    <g fill="#cbd5e1" font-size="13" font-family="Arial, sans-serif" text-anchor="middle">
      <text x="32" y="540">a</text><text x="96" y="540">b</text><text x="160" y="540">c</text><text x="224" y="540">d</text><text x="288" y="540">e</text><text x="352" y="540">f</text><text x="416" y="540">g</text><text x="480" y="540">h</text>
    </g>
    <g font-size="25" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="middle" stroke="#0f172a" stroke-width="1.5" paint-order="stroke">
      <text x="32" y="32" fill="#facc15">r</text><text x="160" y="32" fill="#facc15">b</text><text x="224" y="32" fill="#facc15">q</text><text x="288" y="32" fill="#facc15">k</text><text x="352" y="32" fill="#facc15">b</text><text x="416" y="32" fill="#facc15">n</text><text x="480" y="32" fill="#facc15">r</text>
      <text x="32" y="96" fill="#facc15">p</text><text x="96" y="96" fill="#facc15">p</text><text x="160" y="96" fill="#facc15">p</text><text x="224" y="96" fill="#facc15">p</text><text x="352" y="96" fill="#facc15">p</text><text x="416" y="96" fill="#facc15">p</text><text x="480" y="96" fill="#facc15">p</text>
      <text x="160" y="160" fill="#facc15">n</text>
      <text x="96" y="224" fill="#f8fafc">B</text><text x="288" y="224" fill="#facc15">p</text>
      <text x="288" y="288" fill="#f8fafc">P</text>
      <text x="352" y="352" fill="#f8fafc">N</text>
      <text x="32" y="416" fill="#f8fafc">P</text><text x="96" y="416" fill="#f8fafc">P</text><text x="160" y="416" fill="#f8fafc">P</text><text x="224" y="416" fill="#f8fafc">P</text><text x="352" y="416" fill="#f8fafc">P</text><text x="416" y="416" fill="#f8fafc">P</text><text x="480" y="416" fill="#f8fafc">P</text>
      <text x="32" y="480" fill="#f8fafc">R</text><text x="96" y="480" fill="#f8fafc">N</text><text x="160" y="480" fill="#f8fafc">B</text><text x="224" y="480" fill="#f8fafc">Q</text><text x="288" y="480" fill="#f8fafc">K</text><text x="480" y="480" fill="#f8fafc">R</text>
    </g>
  </g>
  <text x="304" y="650" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Arial, sans-serif">White: K Q R B N P | Black: k q r b n p</text>
