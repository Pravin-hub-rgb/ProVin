<text x="320" y="614" text-anchor="middle" font-family="Courier New, monospace" font-size="9" fill="#cbd5e1" textLength="560" lengthAdjust="spacingAndGlyphs">FEN: Rrk5/8/2N5/8/8/8/8/4K3 w - - 0 1</text>
