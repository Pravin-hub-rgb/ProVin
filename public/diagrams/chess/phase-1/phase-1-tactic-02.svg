<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" role="img" aria-labelledby="title desc">
<title id="title">Phase 1 tactic position 02</title>
<desc id="desc">A White-perspective chess board with a1 at the bottom-left. White to move with a white rook on a8, a black rook on b8, a black king on c8, and a white knight on c6 protecting the capture square. The exact position is FEN Rrk5/8/2N5/8/8/8/8/4K3 w - - 0 1.</desc>
<rect width="640" height="650" rx="12" fill="#0f172a"/>
<text x="320" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Phase 1 • Tactic 02</text>
<rect x="425" y="39" width="190" height="27" rx="13" fill="#1e293b" stroke="#facc15"/>
<text x="520" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#facc15">White to move</text>
<defs>
<pattern id="checker" x="80" y="80" width="120" height="120" patternUnits="userSpaceOnUse">
<rect width="60" height="60" fill="#f3ead3"/>
<rect x="60" width="60" height="60" fill="#6f8f68"/>
<rect y="60" width="60" height="60" fill="#6f8f68"/>
<rect x="60" y="60" width="60" height="60" fill="#f3ead3"/>
</pattern>
</defs>
<rect x="80" y="80" width="480" height="480" fill="url(#checker)" stroke="#e2e8f0" stroke-width="3"/>
<path d="M140 80V560M200 80V560M260 80V560M320 80V560M380 80V560M440 80V560M500 80V560M80 140H560M80 200H560M80 260H560M80 320H560M80 380H560M80 440H560M80 500H560" fill="none" stroke="#334155" stroke-width="1" opacity="0.55"/>
