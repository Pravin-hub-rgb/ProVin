<text x="110" y="583">a</text><text x="170" y="583">b</text><text x="230" y="583">c</text><text x="290" y="583">d</text><text x="350" y="583">e</text><text x="410" y="583">f</text><text x="470" y="583">g</text><text x="530" y="583">h</text>
</g>
