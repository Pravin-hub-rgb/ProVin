<text x="68" y="116">8</text><text x="68" y="176">7</text><text x="68" y="236">6</text><text x="68" y="296">5</text><text x="68" y="356">4</text><text x="68" y="416">3</text><text x="68" y="476">2</text><text x="68" y="536">1</text>
