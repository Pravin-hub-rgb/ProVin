  <text x="300" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">White to move (W) | White perspective | a1 bottom-left</text>
  <rect x="80" y="80" width="480" height="480" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" />
  <path d="M140 80h60v60h-60z M260 80h60v60h-60z M380 80h60v60h-60z M500 80h60v60h-60z M80 140h60v60h-60z M200 140h60v60h-60z M320 140h60v60h-60z M440 140h60v60h-60z M140 200h60v60h-60z M260 200h60v60h-60z M380 200h60v60h-60z M500 200h60v60h-60z M80 260h60v60h-60z M200 260h60v60h-60z M320 260h60v60h-60z M440 260h60v60h-60z M140 320h60v60h-60z M260 320h60v60h-60z M380 320h60v60h-60z M500 320h60v60h-60z M80 380h60v60h-60z M200 380h60v60h-60z M320 380h60v60h-60z M440 380h60v60h-60z M140 440h60v60h-60z M260 440h60v60h-60z M380 440h60v60h-60z M500 440h60v60h-60z M80 500h60v60h-60z M200 500h60v60h-60z M320 500h60v60h-60z M440 500h60v60h-60z" fill="#475569" />
  <g font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#111827" stroke="#f8fafc" stroke-width="1.5" paint-order="stroke">
    <text x="530" y="110">k</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d4ed8" stroke="#f8fafc" stroke-width="1.5" paint-order="stroke">
    <text x="110" y="230">R</text><text x="230" y="230">P</text><text x="110" y="530">K</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">
    <text x="60" y="115">8</text><text x="60" y="175">7</text><text x="60" y="235">6</text><text x="60" y="295">5</text><text x="60" y="355">4</text><text x="60" y="415">3</text><text x="60" y="475">2</text><text x="60" y="535">1</text>
    <text x="110" y="595">a</text><text x="170" y="595">b</text><text x="230" y="595">c</text><text x="290" y="595">d</text><text x="350" y="595">e</text><text x="410" y="595">f</text><text x="470" y="595">g</text><text x="530" y="595">h</text>
