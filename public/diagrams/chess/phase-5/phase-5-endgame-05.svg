<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" role="img" aria-labelledby="p505-title p505-desc" focusable="false">
  <title id="p505-title">Phase 5 exercise 5 — Rook cut-off</title>
  <desc id="p505-desc">White to move. The FEN is 7k/8/R1P5/8/8/8/8/K7 w - - 0 40. White is to place the rook on an active rank and begin a cut-off.</desc>
