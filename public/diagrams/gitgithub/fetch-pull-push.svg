<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" fill="none">
  <rect x="0" y="0" width="620" height="280" rx="10" fill="#0f172a" />

  <!-- Your Computer -->
  <rect x="25" y="30" width="180" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="115" y="58" text-anchor="middle" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">🖥️ Your Computer</text>
  <text x="115" y="78" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">local repo</text>
  <rect x="40" y="95" width="150" height="35" rx="4" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
  <text x="115" y="112" text-anchor="middle" fill="#c7d2fe" font-size="9" font-family="monospace">git commits</text>
  <text x="115" y="125" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">(your saved versions)</text>

  <!-- GitHub -->
  <rect x="415" y="30" width="180" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="505" y="58" text-anchor="middle" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">☁️ GitHub</text>
  <text x="505" y="78" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">remote repo</text>
  <rect x="430" y="95" width="150" height="35" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
  <text x="505" y="112" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="monospace">origin/main</text>
  <text x="505" y="125" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">(team's shared version)</text>

  <!-- FETCH arrow -->
  <line x1="415" y1="60" x2="207" y2="80" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="6,3" />
  <polygon points="207,75 195,80 207,85" fill="#6366f1" />
  <rect x="248" y="42" width="120" height="22" rx="4" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
  <text x="308" y="56" text-anchor="middle" fill="#c7d2fe" font-size="10" font-family="monospace" font-weight="600">git fetch</text>
  <text x="308" y="72" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">downloads info, no file changes</text>

  <!-- PULL arrow -->
  <line x1="415" y1="100" x2="207" y2="100" stroke="#f59e0b" stroke-width="2.5" />
  <polygon points="207,94 190,100 207,106" fill="#f59e0b" />
  <rect x="248" y="88" width="120" height="22" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
  <text x="308" y="102" text-anchor="middle" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="600">git pull</text>
  <text x="308" y="118" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">fetch + merge together</text>

  <!-- PUSH arrow -->
  <polygon points="207,126 190,120 207,114" fill="#22c55e" />
  <line x1="207" y1="120" x2="413" y2="120" stroke="#22c55e" stroke-width="2.5" />
  <rect x="248" y="132" width="120" height="22" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
  <text x="308" y="146" text-anchor="middle" fill="#22c55e" font-size="10" font-family="monospace" font-weight="600">git push</text>
  <text x="308" y="162" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">uploads commits to remote</text>

  <!-- Comparison table at bottom -->
  <line x1="25" y1="188" x2="595" y2="188" stroke="#334155" stroke-width="1" />
  
  <!-- fetch row -->
  <rect x="60" y="198" width="14" height="14" rx="3" fill="#6366f1" />
  <text x="85" y="210" fill="#f8fafc" font-size="10" font-family="sans-serif">fetch — checks what's new. Safe. Nothing changes on your computer.</text>
  
  <!-- pull row -->
  <rect x="60" y="218" width="14" height="14" rx="3" fill="#f59e0b" />
  <text x="85" y="230" fill="#f8fafc" font-size="10" font-family="sans-serif">pull — fetch + merge. Can surprise you with conflicts.</text>
  
  <!-- push row -->
  <rect x="60" y="238" width="14" height="14" rx="3" fill="#22c55e" />
  <text x="85" y="250" fill="#f8fafc" font-size="10" font-family="sans-serif">push — send your commits to GitHub so teammates can see them.</text>

  <!-- Caption -->
  <text x="310" y="272" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">
    fetch = look. pull = fetch + merge. push = send.
  </text>
</svg>