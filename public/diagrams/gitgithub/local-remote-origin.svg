<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" fill="none">
  <rect x="0" y="0" width="600" height="280" rx="10" fill="#0f172a" />

  <!-- Central remote -->
  <rect x="220" y="75" width="160" height="130" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="300" y="100" text-anchor="middle" fill="#93c5fd" font-size="12" font-family="monospace" font-weight="600">🌐 Remote Repo</text>
  <text x="300" y="120" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">(on GitHub servers)</text>
  <rect x="240" y="135" width="120" height="35" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
  <text x="300" y="155" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="monospace">origin/main</text>
  
  <text x="300" y="195" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">nickname: "origin"</text>

  <!-- Dev A -->
  <rect x="40" y="40" width="130" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="105" y="65" text-anchor="middle" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600">👩‍💻 Dev A</text>
  <text x="105" y="82" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">local repo</text>
  <rect x="60" y="95" width="90" height="25" rx="4" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
  <text x="105" y="111" text-anchor="middle" fill="#c7d2fe" font-size="9" font-family="monospace">git push</text>
  <text x="105" y="130" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">uploads changes</text>
  
  <!-- Arrow Dev A → Remote -->
  <line x1="170" y1="90" x2="218" y2="140" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2" />
  <polygon points="218,135 225,140 218,145" fill="#f59e0b" />
  <text x="195" y="108" text-anchor="middle" fill="#fbbf24" font-size="8" font-family="monospace">push</text>

  <!-- Arrow Remote → Dev A -->
  <line x1="218" y1="150" x2="170" y2="115" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2" />
  <polygon points="175,115 168,120 175,125" fill="#22c55e" />
  <text x="195" y="142" text-anchor="middle" fill="#22c55e" font-size="8" font-family="monospace">pull</text>

  <!-- Dev B -->
  <rect x="430" y="40" width="130" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="495" y="65" text-anchor="middle" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600">👨‍💻 Dev B</text>
  <text x="495" y="82" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">local repo</text>
  <rect x="450" y="95" width="90" height="25" rx="4" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
  <text x="495" y="111" text-anchor="middle" fill="#c7d2fe" font-size="9" font-family="monospace">git push</text>

  <!-- Arrow Dev B → Remote -->
  <line x1="430" y1="90" x2="382" y2="140" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2" />
  <polygon points="382,135 375,140 382,145" fill="#f59e0b" />
  <text x="405" y="108" text-anchor="middle" fill="#fbbf24" font-size="8" font-family="monospace">push</text>

  <!-- Arrow Remote → Dev B -->
  <line x1="382" y1="150" x2="430" y2="115" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2" />
  <polygon points="425,115 432,120 425,125" fill="#22c55e" />
  <text x="405" y="142" text-anchor="middle" fill="#22c55e" font-size="8" font-family="monospace">pull</text>

  <!-- Dev C -->
  <rect x="200" y="185" width="200" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="300" y="210" text-anchor="middle" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="600">👩‍💻 Dev C</text>
  <text x="300" y="225" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">local repo → git push → remote → git pull</text>

  <!-- Arrow Dev C → Remote -->
  <line x1="270" y1="185" x2="285" y2="205" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" />
  <polygon points="285,200 290,205 285,210" fill="#f59e0b" />

  <!-- Caption -->
  <text x="300" y="268" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">
    Everyone has their own local copy. origin = nickname for the shared remote everyone syncs through.
  </text>
</svg>