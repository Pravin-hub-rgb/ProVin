<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 320" fill="none">
  <rect x="0" y="0" width="650" height="320" rx="10" fill="#0f172a" />

  <!-- Title -->
  <text x="325" y="28" text-anchor="middle" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">Anatomy of a Merge Conflict Marker</text>

  <!-- Code block background -->
  <rect x="40" y="45" width="570" height="170" rx="8" fill="#1e293b" />
  <rect x="40" y="45" width="570" height="170" rx="8" stroke="#334155" stroke-width="1" />

  <!-- Line numbers -->
  <text x="56" y="70" fill="#475569" font-size="11" font-family="monospace">1</text>
  <text x="56" y="90" fill="#475569" font-size="11" font-family="monospace">2</text>
  <text x="56" y="110" fill="#475569" font-size="11" font-family="monospace">3</text>
  <text x="56" y="130" fill="#475569" font-size="11" font-family="monospace">4</text>
  <text x="56" y="150" fill="#475569" font-size="11" font-family="monospace">5</text>
  <text x="56" y="170" fill="#475569" font-size="11" font-family="monospace">6</text>
  <text x="56" y="190" fill="#475569" font-size="11" font-family="monospace">7</text>

  <!-- Line 1: <<<<<<< HEAD (YOURS) -->
  <rect x="70" y="55" width="520" height="20" rx="3" fill="#ef4444" fill-opacity="0.15" />
  <text x="76" y="70" fill="#ef4444" font-size="12" font-family="monospace" font-weight="bold">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>

  <!-- Line 2: Your version -->
  <rect x="70" y="75" width="520" height="20" rx="3" fill="#3b82f6" fill-opacity="0.1" />
  <text x="76" y="90" fill="#f8fafc" font-size="12" font-family="monospace">&lt;h1&gt;Welcome to the best site ever&lt;/h1&gt;</text>

  <!-- Line 3: ======= -->
  <rect x="70" y="95" width="520" height="20" rx="3" fill="#fbbf24" fill-opacity="0.15" />
  <text x="76" y="110" fill="#fbbf24" font-size="12" font-family="monospace" font-weight="bold">=======</text>

  <!-- Line 4: Their version -->
  <rect x="70" y="115" width="520" height="20" rx="3" fill="#22c55e" fill-opacity="0.1" />
  <text x="76" y="130" fill="#f8fafc" font-size="12" font-family="monospace">&lt;h1&gt;Welcome, friends!&lt;/h1&gt;</text>

  <!-- Line 5: >>>>>>> -->
  <rect x="70" y="135" width="520" height="20" rx="3" fill="#ef4444" fill-opacity="0.15" />
  <text x="76" y="150" fill="#ef4444" font-size="12" font-family="monospace" font-weight="bold">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/teammate-branch</text>

  <!-- Line 6-7: Normal code after -->
  <rect x="70" y="155" width="520" height="20" rx="3" />
  <text x="76" y="170" fill="#64748b" font-size="12" font-family="monospace">&lt;p&gt;Some normal code after the conflict&lt;/p&gt;</text>

  <rect x="70" y="175" width="520" height="20" rx="3" />
  <text x="76" y="190" fill="#64748b" font-size="12" font-family="monospace">&lt;/body&gt;</text>

  <!-- Divider between code and legend -->
  <line x1="40" y1="225" x2="610" y2="225" stroke="#334155" stroke-width="1" />

  <!-- Legend title -->
  <text x="325" y="245" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">Legend</text>

  <!-- Legend items -->
  <rect x="75" y="258" width="14" height="14" rx="3" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1" />
  <text x="96" y="269" fill="#ef4444" font-size="10" font-family="sans-serif">🔴 Markers (Git inserts these — delete them)</text>

  <rect x="75" y="278" width="14" height="14" rx="3" fill="#fbbf24" fill-opacity="0.3" stroke="#fbbf24" stroke-width="1" />
  <text x="96" y="289" fill="#fbbf24" font-size="10" font-family="sans-serif">🟡 Divider line — your version above, their version below</text>

  <text x="420" y="269" fill="#3b82f6" font-size="10" font-family="sans-serif">🔵 Your version (HEAD)</text>
  <text x="420" y="289" fill="#22c55e" font-size="10" font-family="sans-serif">🟢 Their version (incoming branch)</text>

  <!-- Caption -->
  <text x="325" y="312" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">
    Git inserts markers around the two versions. You delete the markers and keep the version you want.
  </text>
</svg>
