<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" fill="none">
  <rect x="0" y="0" width="640" height="290" rx="10" fill="#0f172a" />

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">Standard Branch Workflow — Step by Step</text>

  <!-- Step 1: Switch to main -->
  <rect x="40" y="50" width="140" height="65" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="110" y="72" text-anchor="middle" fill="#3b82f6" font-size="11" font-family="monospace" font-weight="600">Step 1</text>
  <text x="110" y="90" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="monospace">git switch main</text>
  <text x="110" y="107" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">Go to main branch</text>

  <!-- Arrow 1→2 -->
  <line x1="180" y1="82" x2="210" y2="82" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="210,77 222,82 210,87" fill="#f59e0b" />

  <!-- Step 2: Pull latest -->
  <rect x="225" y="50" width="140" height="65" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
  <text x="295" y="72" text-anchor="middle" fill="#22c55e" font-size="11" font-family="monospace" font-weight="600">Step 2</text>
  <text x="295" y="90" text-anchor="middle" fill="#f8fafc" font-size="10" font-family="monospace">git pull origin main</text>
  <text x="295" y="107" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">Get latest from GitHub</text>

  <!-- Arrow 2→3 -->
  <line x1="365" y1="82" x2="395" y2="82" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="395,77 407,82 395,87" fill="#f59e0b" />

  <!-- Step 3: Create branch -->
  <rect x="410" y="50" width="180" height="65" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
  <text x="500" y="72" text-anchor="middle" fill="#6366f1" font-size="11" font-family="monospace" font-weight="600">Step 3</text>
  <text x="500" y="90" text-anchor="middle" fill="#f8fafc" font-size="9" font-family="monospace">git switch -c feature/navbar</text>
  <text x="500" y="107" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">Create + switch to new branch</text>

  <!-- Arrow 3→4 (down then left) -->
  <path d="M 500 115 L 500 135 L 150 135 L 150 155" stroke="#f59e0b" stroke-width="1.5" fill="none" />
  <polygon points="145,155 150,167 155,155" fill="#f59e0b" />

  <!-- Step 4: Work and commit -->
  <rect x="40" y="160" width="220" height="65" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
  <text x="150" y="182" text-anchor="middle" fill="#22c55e" font-size="11" font-family="monospace" font-weight="600">Step 4</text>
  <text x="150" y="200" text-anchor="middle" fill="#f8fafc" font-size="9" font-family="monospace">git add -p &amp;&amp; git commit -m "msg"</text>
  <text x="150" y="217" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">Edit files, stage changes, commit</text>

  <!-- Arrow 4→5 -->
  <line x1="260" y1="192" x2="290" y2="192" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="290,187 302,192 290,197" fill="#f59e0b" />

  <!-- Step 5: Push -->
  <rect x="305" y="160" width="160" height="65" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="385" y="182" text-anchor="middle" fill="#f59e0b" font-size="11" font-family="monospace" font-weight="600">Step 5</text>
  <text x="385" y="200" text-anchor="middle" fill="#f8fafc" font-size="9" font-family="monospace">git push -u origin feature/navbar</text>
  <text x="385" y="217" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">Share branch on GitHub</text>

  <!-- Arrow 5→6 -->
  <line x1="465" y1="192" x2="505" y2="192" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="505,187 517,192 505,197" fill="#f59e0b" />

  <!-- Step 6: Open PR -->
  <rect x="520" y="160" width="80" height="65" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="560" y="182" text-anchor="middle" fill="#3b82f6" font-size="11" font-family="monospace" font-weight="600">Step 6</text>
  <text x="560" y="202" text-anchor="middle" fill="#f8fafc" font-size="9" font-family="sans-serif">Open</text>
  <text x="560" y="216" text-anchor="middle" fill="#f8fafc" font-size="9" font-family="sans-serif">PR</text>

  <!-- Important note at bottom -->
  <rect x="40" y="240" width="560" height="28" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
  <text x="320" y="255" text-anchor="middle" fill="#fbbf24" font-size="9" font-family="sans-serif">
    ⚠️ Don't skip Step 2 (git pull). Branching off stale main = extra conflicts later.
  </text>

  <!-- Caption -->
  <text x="320" y="283" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">
    This 6-step cycle is the daily rhythm of every developer on a Git team.
  </text>
</svg>
