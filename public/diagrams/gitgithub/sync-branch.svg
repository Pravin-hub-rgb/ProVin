<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" fill="none">
  <rect x="0" y="0" width="600" height="280" rx="10" fill="#0f172a" />

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">Keeping Your Branch Up to Date with Main</text>

  <!-- BEFORE section -->
  <text x="150" y="55" text-anchor="middle" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="600">BEFORE syncing</text>

  <!-- main branch -->
  <circle cx="60" cy="85" r="7" fill="#3b82f6" />
  <line x1="67" y1="85" x2="95" y2="85" stroke="#3b82f6" stroke-width="2" />
  <circle cx="102" cy="85" r="7" fill="#3b82f6" />
  <line x1="109" y1="85" x2="137" y2="85" stroke="#3b82f6" stroke-width="2" />
  <circle cx="144" cy="85" r="7" fill="#3b82f6" />
  <line x1="151" y1="85" x2="179" y2="85" stroke="#3b82f6" stroke-width="2" />
  <circle cx="186" cy="85" r="7" fill="#22c55e" />
  <line x1="193" y1="85" x2="221" y2="85" stroke="#3b82f6" stroke-width="2" />
  <circle cx="228" cy="85" r="7" fill="#22c55e" />

  <rect x="240" y="78" width="50" height="14" rx="3" fill="#3b82f6" />
  <text x="265" y="88" text-anchor="middle" fill="#f8fafc" font-size="8" font-family="monospace">main</text>

  <!-- "your branch" branching off -->
  <line x1="60" y1="92" x2="60" y2="125" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2" />
  <circle cx="60" cy="135" r="7" fill="#22c55e" stroke="#16a34a" stroke-width="1" />
  <line x1="60" y1="142" x2="60" y2="155" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2" />
  <circle cx="60" cy="162" r="7" fill="#22c55e" stroke="#16a34a" stroke-width="1" />

  <rect x="75" y="122" width="130" height="14" rx="3" fill="#22c55e" opacity="0.2" />
  <text x="140" y="132" text-anchor="middle" fill="#22c55e" font-size="8" font-family="monospace">feature/navbar</text>
  
  <rect x="75" y="145" width="130" height="12" rx="2" fill="#1e293b" />
  <text x="80" y="154" fill="#94a3b8" font-size="7" font-family="sans-serif">⬅ Behind by 4 commits</text>
  <rect x="75" y="160" width="130" height="12" rx="2" fill="#1e293b" />
  <text x="80" y="169" fill="#fc6c6c" font-size="7" font-family="sans-serif">⚠️ Conflict bomb risk!</text>

  <!-- Arrow: BEFORE → AFTER -->
  <line x1="310" y1="120" x2="350" y2="120" stroke="#f59e0b" stroke-width="2" />
  <polygon points="350,114 365,120 350,126" fill="#f59e0b" />
  <text x="338" y="110" text-anchor="middle" fill="#fbbf24" font-size="8" font-family="monospace">git fetch + merge</text>

  <!-- AFTER section -->
  <text x="475" y="55" text-anchor="middle" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="600">AFTER syncing</text>

  <!-- main branch after -->
  <circle cx="390" cy="85" r="7" fill="#3b82f6" />
  <line x1="397" y1="85" x2="418" y2="85" stroke="#3b82f6" stroke-width="2" />
  <circle cx="425" cy="85" r="7" fill="#3b82f6" />
  <line x1="432" y1="85" x2="453" y2="85" stroke="#3b82f6" stroke-width="2" />
  <circle cx="460" cy="85" r="7" fill="#3b82f6" />
  <line x1="467" y1="85" x2="488" y2="85" stroke="#3b82f6" stroke-width="2" />
  <circle cx="495" cy="85" r="7" fill="#22c55e" />
  <line x1="502" y1="85" x2="523" y2="85" stroke="#3b82f6" stroke-width="2" />
  <circle cx="530" cy="85" r="7" fill="#22c55e" />

  <!-- Branch now includes main's commits -->
  <line x1="390" y1="92" x2="390" y2="115" stroke="#22c55e" stroke-width="2" />
  <line x1="425" y1="92" x2="425" y2="115" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2" />
  <line x1="460" y1="92" x2="460" y2="115" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2" />
  <line x1="495" y1="92" x2="495" y2="115" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Branch commits after -->
  <circle cx="390" cy="125" r="7" fill="#22c55e" stroke="#16a34a" stroke-width="1" />
  <line x1="390" y1="132" x2="390" y2="145" stroke="#22c55e" stroke-width="2" />
  <circle cx="390" cy="152" r="7" fill="#22c55e" stroke="#16a34a" stroke-width="1" />
  
  <!-- Merge commit connecting all -->
  <circle cx="390" cy="162" r="8" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
  <line x1="390" y1="85" x2="390" y2="117" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="530" y1="85" x2="390" y2="162" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />

  <rect x="405" y="148" width="160" height="14" rx="3" fill="#22c55e" opacity="0.2" />
  <text x="485" y="158" text-anchor="middle" fill="#22c55e" font-size="8" font-family="monospace">feature/navbar (up to date!)</text>

  <rect x="405" y="132" width="160" height="14" rx="2" fill="#1e293b" />
  <text x="410" y="142" fill="#22c55e" font-size="7" font-family="sans-serif">✅ Caught up with main</text>

  <!-- Commands box -->
  <rect x="50" y="200" width="500" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="300" y="218" text-anchor="middle" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="600">git switch feature/navbar → git fetch origin → git merge origin/main</text>
  <text x="300" y="233" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">Do this at least once a day while your branch is alive</text>

  <!-- Caption -->
  <text x="300" y="270" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">
    Regular syncing = small conflicts (or none). Stale branches = conflict bombs.
  </text>
</svg>