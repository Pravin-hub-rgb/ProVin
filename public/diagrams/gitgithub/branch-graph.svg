<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" fill="none">
  <rect x="0" y="0" width="860" height="540" rx="10" fill="#0f172a" />

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="600">Reading a Branch Graph (git tree)</text>

  <!-- ===== CONNECTING LINES ===== -->
  <!-- Root → Left -->
  <path d="M 280 225 L 80 188" stroke="#3b82f6" stroke-width="2" />
  <!-- Root → Right -->
  <path d="M 280 225 L 480 188" stroke="#22c55e" stroke-width="2" />
  <!-- Left branch vertical -->
  <line x1="80" y1="130" x2="80" y2="180" stroke="#3b82f6" stroke-width="2" />
  <!-- Right branch vertical -->
  <line x1="480" y1="130" x2="480" y2="180" stroke="#22c55e" stroke-width="2" />
  <!-- Left → Merge -->
  <path d="M 80 115 L 280 80" stroke="#3b82f6" stroke-width="2" />
  <!-- Right → Merge -->
  <path d="M 480 115 L 280 80" stroke="#22c55e" stroke-width="2" />

  <!-- ===== COMMIT CIRCLES & LABELS ===== -->

  <!-- Merge commit (top center) -->
  <circle cx="280" cy="70" r="10" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
  <line x1="280" y1="60" x2="280" y2="53" stroke="#f59e0b" stroke-width="1" />
  <text x="280" y="48" text-anchor="middle" fill="#f8fafc" font-size="9" font-family="monospace">9a8b7c6 (HEAD -> main) Merge feature/navbar into main</text>

  <!-- Left branch (main) — labels on the RIGHT -->
  <circle cx="80" cy="125" r="10" fill="#3b82f6" stroke="#2563eb" stroke-width="2" />
  <line x1="90" y1="125" x2="105" y2="125" stroke="#3b82f6" stroke-width="1" />
  <text x="110" y="129" fill="#f8fafc" font-size="10" font-family="monospace">f5e6d7c Fix login validation</text>

  <circle cx="80" cy="180" r="10" fill="#3b82f6" stroke="#2563eb" stroke-width="2" />
  <line x1="90" y1="180" x2="105" y2="180" stroke="#3b82f6" stroke-width="1" />
  <text x="110" y="184" fill="#f8fafc" font-size="10" font-family="monospace">8a9b0c1 Add password reset</text>

  <!-- Main branch badge -->
  <rect x="55" y="148" width="50" height="14" rx="3" fill="#3b82f6" />
  <text x="80" y="158" text-anchor="middle" fill="#fff" font-size="7" font-family="sans-serif" font-weight="600">main</text>

  <!-- Right branch (feature) — labels on the RIGHT -->
  <circle cx="480" cy="125" r="10" fill="#22c55e" stroke="#16a34a" stroke-width="2" />
  <line x1="490" y1="125" x2="505" y2="125" stroke="#22c55e" stroke-width="1" />
  <text x="510" y="129" fill="#f8fafc" font-size="10" font-family="monospace">2b3c4d5 (feature/navbar) Add dropdown menu</text>

  <circle cx="480" cy="180" r="10" fill="#22c55e" stroke="#16a34a" stroke-width="2" />
  <line x1="490" y1="180" x2="505" y2="180" stroke="#22c55e" stroke-width="1" />
  <text x="510" y="184" fill="#f8fafc" font-size="10" font-family="monospace">1a2b3c4 Adjust spacing on mobile</text>

  <!-- Feature branch badge -->
  <rect x="450" y="148" width="60" height="14" rx="3" fill="#22c55e" />
  <text x="480" y="158" text-anchor="middle" fill="#fff" font-size="7" font-family="sans-serif" font-weight="600">feature</text>

  <!-- Root commit (bottom center) -->
  <circle cx="280" cy="235" r="10" fill="#a855f7" stroke="#7c3aed" stroke-width="2" />
  <line x1="290" y1="235" x2="305" y2="235" stroke="#a855f7" stroke-width="1" />
  <text x="310" y="239" fill="#f8fafc" font-size="10" font-family="monospace">4d3e2f1 Initial commit</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="30" y1="275" x2="830" y2="275" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ===== TERMINAL SECTION ===== -->
  <text x="430" y="300" text-anchor="middle" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600">What This Looks Like in Your Terminal</text>
  <text x="430" y="316" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">Run git log --graph --oneline --all to see this:</text>

  <!-- Terminal window -->
  <rect x="60" y="330" width="740" height="165" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="60" y="330" width="740" height="22" rx="6" fill="#1e293b" />
  <circle cx="75" cy="341" r="4" fill="#ef4444" />
  <circle cx="88" cy="341" r="4" fill="#f59e0b" />
  <circle cx="101" cy="341" r="4" fill="#22c55e" />
  <text x="430" y="344" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">terminal</text>

  <text x="80" y="367" fill="#f8fafc" font-size="12" font-family="monospace"><tspan fill="#22c55e">*</tspan>   9a8b7c6 (HEAD -> main) Merge feature/navbar into main</text>
  <text x="80" y="383" fill="#f8fafc" font-size="12" font-family="monospace">|<tspan fill="#22c55e">\</tspan></text>
  <text x="80" y="399" fill="#f8fafc" font-size="12" font-family="monospace">| <tspan fill="#22c55e">*</tspan> 2b3c4d5 (feature/navbar) Add dropdown menu</text>
  <text x="80" y="415" fill="#f8fafc" font-size="12" font-family="monospace">| <tspan fill="#22c55e">*</tspan> 1a2b3c4 Adjust spacing on mobile</text>
  <text x="80" y="431" fill="#f8fafc" font-size="12" font-family="monospace"><tspan fill="#22c55e">*</tspan> | f5e6d7c Fix login validation</text>
  <text x="80" y="447" fill="#f8fafc" font-size="12" font-family="monospace"><tspan fill="#22c55e">*</tspan> | 8a9b0c1 Add password reset</text>
  <text x="80" y="463" fill="#f8fafc" font-size="12" font-family="monospace">|<tspan fill="#22c55e">/</tspan></text>
  <text x="80" y="479" fill="#f8fafc" font-size="12" font-family="monospace"><tspan fill="#22c55e">*</tspan> 4d3e2f1 Initial commit</text>

  <!-- Legend -->
  <text x="430" y="515" text-anchor="middle" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="600">Symbols: <tspan fill="#94a3b8" font-weight="400">* = a commit | | = history continues | \ and / = branches split or join</tspan></text>
</svg>
