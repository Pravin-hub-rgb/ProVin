<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" fill="none">
  <rect x="0" y="0" width="580" height="260" rx="10" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#0369a1">📨 How a Request Travels: Keyboard to Data Center and Back</text>

  <!-- Step boxes connected by arrows -->
  <rect x="10" y="45" width="80" height="50" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="50" y="65" text-anchor="middle" fill="#334155" font-size="8" font-weight="600" font-family="sans-serif">⌨️ You type</text>
  <text x="50" y="80" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">a message</text>

  <path d="M90,70 L100,70" stroke="#f59e0b" stroke-width="2" />
  <polygon points="100,66 108,70 100,74" fill="#f59e0b" />

  <rect x="110" y="45" width="80" height="50" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="150" y="65" text-anchor="middle" fill="#334155" font-size="8" font-weight="600" font-family="sans-serif">🔢 Tokenize</text>
  <text x="150" y="80" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">text → numbers</text>

  <path d="M190,70 L200,70" stroke="#f59e0b" stroke-width="2" />
  <polygon points="200,66 208,70 200,74" fill="#f59e0b" />

  <rect x="210" y="45" width="80" height="50" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="250" y="65" text-anchor="middle" fill="#334155" font-size="8" font-weight="600" font-family="sans-serif">🌐 API call</text>
  <text x="250" y="80" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">POST to server</text>

  <path d="M290,70 L300,70" stroke="#f59e0b" stroke-width="2" />
  <polygon points="300,66 308,70 300,74" fill="#f59e0b" />

  <rect x="310" y="45" width="80" height="50" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="350" y="65" text-anchor="middle" fill="#334155" font-size="8" font-weight="600" font-family="sans-serif">🔑 Auth</text>
  <text x="350" y="80" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">API key check</text>

  <path d="M390,70 L400,70" stroke="#f59e0b" stroke-width="2" />
  <polygon points="400,66 408,70 400,74" fill="#f59e0b" />

  <rect x="410" y="45" width="80" height="50" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="450" y="65" text-anchor="middle" fill="#334155" font-size="8" font-weight="600" font-family="sans-serif">🧠 Model</text>
  <text x="450" y="80" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">predicts tokens</text>

  <!-- Data center highlight -->
  <rect x="310" y="40" width="180" height="60" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2" />
  <text x="400" y="35" text-anchor="middle" fill="#166534" font-size="7" font-weight="600" font-family="sans-serif">☁️ Provider's Server (Data Center)</text>

  <!-- Streaming back -->
  <path d="M450,95 L450,120 L50,120 L50,95" stroke="#f59e0b" stroke-width="2" fill="none" />
  <polygon points="50,95 54,103 46,103" fill="#f59e0b" />
  <text x="250" y="133" text-anchor="middle" fill="#d97706" font-size="7" font-weight="600" font-family="sans-serif">⬅️ Streaming response back (tokens sent one by one as they're generated)</text>

  <!-- Display step -->
  <rect x="10" y="145" width="550" height="40" rx="6" fill="#0f172a" />
  <text x="30" y="162" fill="#94a3b8" font-size="9" font-family="sans-serif">7. 📺 Your tool decodes tokens back to text and displays the response</text>
  <text x="30" y="177" fill="#94a3b8" font-size="9" font-family="sans-serif">    You see the words appear one by one as each token arrives</text>

  <!-- Bottom note -->
  <text x="290" y="212" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">The whole round trip takes ~2-10 seconds. Your message travels to a data center,</text>
  <text x="290" y="225" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">passes through billions of calculations, and comes back — all while you wait.</text>

  <!-- Analogy -->
  <rect x="10" y="235" width="560" height="18" rx="4" fill="#fff3cd" stroke="#ffc107" stroke-width="1" />
  <text x="290" y="248" text-anchor="middle" fill="#856404" font-size="8" font-family="sans-serif">🍕 Analogy: Like ordering pizza — your kitchen doesn't have ingredients, so you call a restaurant (API call), they cook (model predicts), and deliver (streams response).</text>
</svg>