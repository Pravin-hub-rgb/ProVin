<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" fill="none">
  <rect x="0" y="0" width="580" height="220" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#3730a3">🔌 MCP (Model Context Protocol) — USB for AI Tools</text>

  <!-- Before MCP -->
  <rect x="15" y="42" width="260" height="80" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
  <text x="145" y="62" text-anchor="middle" fill="#991b1b" font-size="10" font-weight="600" font-family="sans-serif">❌ Before MCP: Custom Everything</text>
  <rect x="25" y="72" width="75" height="20" rx="4" fill="#0f172a" />
  <text x="62" y="86" text-anchor="middle" fill="#fca5a5" font-size="6.5" font-family="monospace">📂 Files code</text>
  <rect x="105" y="72" width="75" height="20" rx="4" fill="#0f172a" />
  <text x="142" y="86" text-anchor="middle" fill="#fca5a5" font-size="6.5" font-family="monospace">📡 GitHub code</text>
  <rect x="185" y="72" width="75" height="20" rx="4" fill="#0f172a" />
  <text x="222" y="86" text-anchor="middle" fill="#fca5a5" font-size="6.5" font-family="monospace">💬 Slack code</text>
  <text x="145" y="112" text-anchor="middle" fill="#b91c1c" font-size="7" font-family="sans-serif">Each integration required custom code,</text>
  <text x="145" y="124" text-anchor="middle" fill="#b91c1c" font-size="7" font-family="sans-serif">different APIs, different auth — a mess.</text>

  <!-- Arrow -->
  <path d="M275,82 L295,82" stroke="#22c55e" stroke-width="2" />
  <polygon points="295,79 303,82 295,85" fill="#22c55e" />
  <text x="285" y="74" text-anchor="middle" fill="#16a34a" font-size="7" font-weight="600" font-family="sans-serif">MCP</text>

  <!-- After MCP -->
  <rect x="305" y="42" width="260" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="435" y="62" text-anchor="middle" fill="#166534" font-size="10" font-weight="600" font-family="sans-serif">✅ After MCP: One Standard Plug</text>
  <rect x="330" y="75" width="50" height="20" rx="4" fill="#0f172a" />
  <text x="355" y="89" text-anchor="middle" fill="#86efac" font-size="6.5" font-family="monospace">🤖 AI</text>
  <path d="M380,85 L400,85" stroke="#86efac" stroke-width="1.5" />
  <rect x="402" y="72" width="60" height="25" rx="4" fill="#312e81" />
  <text x="432" y="89" text-anchor="middle" fill="#c7d2fe" font-size="7" font-weight="600" font-family="monospace">🔌 MCP</text>
  <path d="M462,85 L475,85" stroke="#86efac" stroke-width="1.5" />
  <rect x="477" y="72" width="75" height="25" rx="4" fill="#0f172a" />
  <text x="514" y="86" text-anchor="middle" fill="#86efac" font-size="6.5" font-family="monospace">📂📡💬</text>
  <text x="435" y="112" text-anchor="middle" fill="#15803d" font-size="7" font-family="sans-serif">One protocol. Any tool. AI speaks MCP,</text>
  <text x="435" y="124" text-anchor="middle" fill="#15803d" font-size="7" font-family="sans-serif">tool speaks MCP — no custom bridges.</text>

  <!-- USB analogy -->
  <rect x="15" y="137" width="550" height="75" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1" />

  <text x="30" y="157" fill="#334155" font-size="11" font-weight="600" font-family="sans-serif">🔌 The USB Analogy</text>

  <rect x="30" y="168" width="80" height="22" rx="4" fill="#0f172a" />
  <text x="70" y="183" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="monospace">🖱️ Mouse</text>
  <text x="115" y="183" fill="#64748b" font-size="7" font-family="sans-serif">🔌</text>
  <rect x="125" y="168" width="60" height="22" rx="4" fill="#312e81" />
  <text x="155" y="183" text-anchor="middle" fill="#c7d2fe" font-size="7" font-family="monospace">USB</text>
  <text x="190" y="183" fill="#64748b" font-size="7" font-family="sans-serif">🔌</text>
  <rect x="200" y="168" width="80" height="22" rx="4" fill="#0f172a" />
  <text x="240" y="183" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="monospace">💻 Computer</text>

  <text x="330" y="183" fill="#475569" font-size="8" font-family="sans-serif">Before USB: every device had its own connector.</text>
  <text x="30" y="205" fill="#475569" font-size="8" font-family="sans-serif">MCP is USB for AI — one standard plug for file systems, GitHub, Slack, databases, everything.</text>
</svg>