<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" fill="none">
  <rect x="0" y="0" width="580" height="230" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#7c3aed">🔀 Multiple Tools — The Model Chooses, Your Code Routes</text>

  <!-- User -->
  <rect x="15" y="42" width="130" height="50" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" />
  <text x="80" y="60" text-anchor="middle" fill="#1e40af" font-size="9" font-weight="600" font-family="sans-serif">👤 User asks</text>
  <text x="80" y="78" text-anchor="middle" fill="#2563eb" font-size="7" font-family="sans-serif">"15% of 200 + today?"</text>

  <path d="M145,67 L175,67" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="175,64 182,67 175,70" fill="#f59e0b" />

  <!-- Model decision -->
  <rect x="185" y="42" width="130" height="50" rx="6" fill="#0f172a" />
  <text x="250" y="58" text-anchor="middle" fill="#fcd34d" font-size="8" font-weight="600" font-family="monospace">🧠 Model decides</text>
  <text x="250" y="75" text-anchor="middle" fill="#fbbf24" font-size="7" font-family="monospace">"calculator" +</text>
  <text x="250" y="88" text-anchor="middle" fill="#fbbf24" font-size="7" font-family="monospace">"get_current_date"</text>

  <path d="M315,67 L340,67" stroke="#22c55e" stroke-width="1.5" />
  <polygon points="340,64 347,67 340,70" fill="#22c55e" />

  <!-- Dispatcher -->
  <rect x="350" y="42" width="120" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
  <text x="410" y="60" text-anchor="middle" fill="#92400e" font-size="9" font-weight="600" font-family="sans-serif">🔀 Dispatcher</text>
  <text x="410" y="78" text-anchor="middle" fill="#b45309" font-size="7" font-family="sans-serif">switch(toolName)</text>

  <!-- Split arrows to different tools -->
  <path d="M350,92 L100,110" stroke="#3b82f6" stroke-width="1.5" />
  <polygon points="100,107 107,110 100,113" fill="#3b82f6" />

  <path d="M410,92 L410,110" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="407,110 410,116 413,110" fill="#f59e0b" />

  <path d="M470,92 L510,110" stroke="#ef4444" stroke-width="1.5" />
  <polygon points="510,107 517,110 510,113" fill="#ef4444" />

  <!-- Tool implementations -->
  <rect x="15" y="115" width="170" height="55" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="100" y="133" text-anchor="middle" fill="#1e40af" font-size="9" font-weight="600" font-family="sans-serif">📐 calculator(expr)</text>
  <text x="100" y="150" text-anchor="middle" fill="#2563eb" font-size="7" font-family="monospace">→ eval("15/100 * 200")</text>
  <text x="100" y="164" text-anchor="middle" fill="#2563eb" font-size="7" font-family="monospace">→ "30"</text>

  <rect x="200" y="115" width="170" height="55" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="285" y="133" text-anchor="middle" fill="#166534" font-size="9" font-weight="600" font-family="sans-serif">📅 getCurrentDate()</text>
  <text x="285" y="150" text-anchor="middle" fill="#15803d" font-size="7" font-family="monospace">→ new Date().toISOString()</text>
  <text x="285" y="164" text-anchor="middle" fill="#15803d" font-size="7" font-family="monospace">→ "2026-06-14"</text>

  <rect x="385" y="115" width="180" height="55" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
  <text x="475" y="133" text-anchor="middle" fill="#991b1b" font-size="9" font-weight="600" font-family="sans-serif">🔍 searchWeb(query)</text>
  <text x="475" y="150" text-anchor="middle" fill="#b91c1c" font-size="7" font-family="monospace">→ Tavily API call</text>
  <text x="475" y="164" text-anchor="middle" fill="#b91c1c" font-size="7" font-family="monospace">→ search results</text>

  <!-- Results sent back -->
  <path d="M100,170 L100,190 L250,190" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2" />
  <path d="M285,170 L285,190" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,2" />
  <path d="M475,170 L475,190 L410,190" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" />

  <rect x="210" y="190" width="160" height="30" rx="6" fill="#0f172a" />
  <text x="290" y="210" text-anchor="middle" fill="#86efac" font-size="8" font-family="sans-serif">⬅️ All results combined → model gives final answer</text>
</svg>