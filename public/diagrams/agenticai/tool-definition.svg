<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" fill="none">
  <rect x="0" y="0" width="580" height="230" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#166534">🔧 Anatomy of a Tool Definition — The Interface Between Model & World</text>

  <rect x="15" y="40" width="550" height="120" rx="6" fill="#0f172a" />
  <text x="30" y="58" fill="#cbd5e1" font-size="8" font-family="monospace">const tools = [</text>
  <text x="30" y="73" fill="#cbd5e1" font-size="8" font-family="monospace">  {</text>

  <!-- Name -->
  <rect x="45" y="82" width="200" height="24" rx="3" fill="#312e81" />
  <text x="55" y="98" fill="#c7d2fe" font-size="8" font-family="monospace">name: "calculator",</text>
  <text x="255" y="98" fill="#94a3b8" font-size="7" font-family="sans-serif">📛 Short name the model uses to call it</text>

  <!-- Description -->
  <rect x="45" y="112" width="200" height="24" rx="3" fill="#991b1b" />
  <text x="55" y="128" fill="#fca5a5" font-size="7.5" font-family="monospace">description: "Evaluate math expressions...",</text>
  <text x="255" y="128" fill="#94a3b8" font-size="7" font-family="sans-serif">📝 Model's only hint about WHEN to use it</text>

  <!-- Input schema -->
  <rect x="45" y="142" width="200" height="30" rx="3" fill="#166534" />
  <text x="55" y="155" fill="#86efac" font-size="7.5" font-family="monospace">input_schema: {</text>
  <text x="55" y="167" fill="#86efac" font-size="7.5" font-family="monospace">  properties: { expression: { type: "string" } },</text>
  <text x="55" y="180" fill="#86efac" font-size="7.5" font-family="monospace">  required: ["expression"]</text>
  <text x="55" y="190" fill="#86efac" font-size="7.5" font-family="monospace">}</text>

  <text x="255" y="155" fill="#94a3b8" font-size="7" font-family="sans-serif">📋 JSON Schema describing parameters</text>
  <text x="255" y="170" fill="#94a3b8" font-size="7" font-family="sans-serif">Type, description, required fields</text>
  <text x="255" y="185" fill="#94a3b8" font-size="7" font-family="sans-serif">Like a form the model fills out</text>

  <!-- Key insight -->
  <rect x="15" y="175" width="550" height="48" rx="6" fill="#fff" stroke="#22c55e" stroke-width="1" />

  <text x="30" y="192" fill="#166534" font-size="9" font-weight="600" font-family="sans-serif">💡 The description is everything.</text>
  <text x="30" y="208" fill="#475569" font-size="8" font-family="sans-serif">A good description: "Use this for any arithmetic or numeric computation rather than doing math yourself."</text>
  <text x="30" y="222" fill="#94a3b8" font-size="7" font-family="sans-serif">A bad description: "A calculator tool" — too vague, model won't know when to reach for it.</text>
</svg>