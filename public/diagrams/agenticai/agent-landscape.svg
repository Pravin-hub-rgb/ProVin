<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" fill="none">
  <rect x="0" y="0" width="580" height="220" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#1e293b">🌍 Where Agents Live Today</text>

  <!-- Coding Agents -->
  <rect x="15" y="42" width="260" height="80" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="145" y="62" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="600" font-family="sans-serif">💻 Coding Agents</text>
  <text x="145" y="78" text-anchor="middle" fill="#2563eb" font-size="8" font-family="sans-serif">Cline, opencode, Cursor, GitHub Copilot</text>
  <text x="145" y="95" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Read/write code, run commands, debug, push to GitHub</text>
  <text x="145" y="110" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Most mature category — code is structured, tools are clear</text>

  <!-- Research Agents -->
  <rect x="305" y="42" width="260" height="80" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="435" y="62" text-anchor="middle" fill="#166534" font-size="11" font-weight="600" font-family="sans-serif">🔍 Research Agents</text>
  <text x="435" y="78" text-anchor="middle" fill="#15803d" font-size="8" font-family="sans-serif">Perplexity, ChatGPT with search, Claude research</text>
  <text x="435" y="95" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Search web, read multiple sources, synthesize answers</text>
  <text x="435" y="110" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">No more digging through 10 tabs — agent does it</text>

  <!-- Browser Agents -->
  <rect x="15" y="130" width="260" height="80" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" />
  <text x="145" y="150" text-anchor="middle" fill="#92400e" font-size="11" font-weight="600" font-family="sans-serif">🌐 Browser Agents</text>
  <text x="145" y="166" text-anchor="middle" fill="#b45309" font-size="8" font-family="sans-serif">Claude computer use, Operator, open-source</text>
  <text x="145" y="183" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Control mouse & keyboard, click, fill forms</text>
  <text x="145" y="198" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Interact with sites that don't have APIs</text>

  <!-- Business Agents -->
  <rect x="305" y="130" width="260" height="80" rx="8" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.5" />
  <text x="435" y="150" text-anchor="middle" fill="#6b21a8" font-size="11" font-weight="600" font-family="sans-serif">🏢 Business Agents</text>
  <text x="435" y="166" text-anchor="middle" fill="#7c3aed" font-size="8" font-family="sans-serif">Lindy, AutoGPT, custom AI workflows</text>
  <text x="435" y="183" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Sort emails, update CRM, generate invoices</text>
  <text x="435" y="198" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Handle the boring stuff — save real hours</text>
</svg>