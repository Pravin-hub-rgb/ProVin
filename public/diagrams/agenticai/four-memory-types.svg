<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" fill="none">
  <rect x="0" y="0" width="580" height="230" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#3730a3">🧠 Four Types of Memory in Agents</text>

  <!-- In-context -->
  <rect x="15" y="42" width="260" height="85" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.5" />
  <text x="145" y="62" text-anchor="middle" fill="#4338ca" font-size="10" font-weight="600" font-family="sans-serif">📋 In-Context Memory</text>
  <text x="145" y="78" text-anchor="middle" fill="#6366f1" font-size="7" font-family="sans-serif">The messages array you send each time</text>
  <text x="145" y="93" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Temporary — limited by context window</text>
  <text x="145" y="108" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Costs tokens every time. Drops old content.</text>
  <text x="145" y="122" text-anchor="middle" fill="#f59e0b" font-size="7" font-weight="600" font-family="sans-serif">⭐ YOUR DAILY BREAD as a builder</text>

  <!-- External -->
  <rect x="305" y="42" width="260" height="85" rx="6" fill="#fff" stroke="#22c55e" stroke-width="1.5" />
  <text x="435" y="62" text-anchor="middle" fill="#166534" font-size="10" font-weight="600" font-family="sans-serif">📚 External Memory (Vector Stores)</text>
  <text x="435" y="78" text-anchor="middle" fill="#15803d" font-size="7" font-family="sans-serif">Databases, embeddings, RAG</text>
  <text x="435" y="93" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Search past conversations, codebase, docs</text>
  <text x="435" y="108" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Retrieve only what's relevant — scalable</text>
  <text x="435" y="122" text-anchor="middle" fill="#f59e0b" font-size="7" font-weight="600" font-family="sans-serif">⭐ POWERFUL for large knowledge bases</text>

  <!-- In-weights -->
  <rect x="15" y="137" width="260" height="85" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1.5" />
  <text x="145" y="157" text-anchor="middle" fill="#92400e" font-size="10" font-weight="600" font-family="sans-serif">🏋️ In-Weights Memory</text>
  <text x="145" y="173" text-anchor="middle" fill="#b45309" font-size="7" font-family="sans-serif">What the model learned during training</text>
  <text x="145" y="188" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Facts, patterns, language rules</text>
  <text x="145" y="203" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Permanent until next training run</text>
  <text x="145" y="217" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Can't change at runtime — frozen at training</text>

  <!-- In-cache -->
  <rect x="305" y="137" width="260" height="85" rx="6" fill="#fff" stroke="#c084fc" stroke-width="1.5" />
  <text x="435" y="157" text-anchor="middle" fill="#6b21a8" font-size="10" font-weight="600" font-family="sans-serif">⚡ In-Cache Memory</text>
  <text x="435" y="173" text-anchor="middle" fill="#7c3aed" font-size="7" font-family="sans-serif">Cache intermediate computation states</text>
  <text x="435" y="188" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Speed up repeated requests</text>
  <text x="435" y="203" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Performance optimization</text>
  <text x="435" y="217" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Not something you control directly</text>
</svg>