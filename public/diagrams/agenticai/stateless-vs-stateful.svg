<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" fill="none">
  <rect x="0" y="0" width="580" height="230" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#991b1b">🧠 The Problem: Stateless Models — Each Call Starts Fresh</text>

  <!-- Stateless (current) -->
  <rect x="15" y="40" width="260" height="130" rx="8" fill="#fff" stroke="#f87171" stroke-width="1.5" />
  <text x="145" y="62" text-anchor="middle" fill="#991b1b" font-size="10" font-weight="600" font-family="sans-serif">❌ LLMs Are Stateless</text>

  <rect x="30" y="75" width="230" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="145" y="90" text-anchor="middle" fill="#b91c1c" font-size="7" font-family="monospace">Call 1: User: "Create dark theme"</text>

  <rect x="30" y="101" width="230" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="145" y="116" text-anchor="middle" fill="#b91c1c" font-size="7" font-family="monospace">Call 2: Model sees ZERO memory of Call 1</text>

  <rect x="30" y="127" width="230" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="145" y="142" text-anchor="middle" fill="#b91c1c" font-size="7" font-family="monospace">Call 3: You must resend everything!</text>

  <text x="145" y="162" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Each request is independent — like a vending machine</text>

  <!-- Stateful (ideal) -->
  <rect x="305" y="40" width="260" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2" />
  <text x="435" y="62" text-anchor="middle" fill="#166534" font-size="10" font-weight="600" font-family="sans-serif">✅ Ideal: Stateful (doesn't exist yet)</text>

  <rect x="320" y="75" width="230" height="22" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="435" y="90" text-anchor="middle" fill="#15803d" font-size="7" font-family="monospace">Call 1: User: "Create dark theme"</text>

  <rect x="320" y="101" width="230" height="22" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="435" y="116" text-anchor="middle" fill="#15803d" font-size="7" font-family="monospace">Call 2: "Oh right, I was working on the theme!"</text>

  <rect x="320" y="127" width="230" height="22" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="435" y="142" text-anchor="middle" fill="#15803d" font-size="7" font-family="monospace">Call 3: Remembers everything naturally</text>

  <text x="435" y="162" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Server remembers past calls — like a conversation</text>

  <!-- Bottom section -->
  <rect x="15" y="180" width="550" height="42" rx="6" fill="#0f172a" />
  <text x="30" y="197" fill="#fcd34d" font-size="8" font-weight="600" font-family="sans-serif">💡 The workaround: YOU resend the history every time</text>
  <text x="30" y="213" fill="#94a3b8" font-size="8" font-family="sans-serif">Your code appends each turn to the messages array and sends the whole thing with every API call. The model still sees it — but you're the one carrying the backpack.</text>
</svg>