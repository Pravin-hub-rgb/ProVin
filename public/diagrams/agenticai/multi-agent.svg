<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" fill="none">
  <rect x="0" y="0" width="580" height="230" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#166534">👥 Multi-Agent System — A Team of Specialists</text>

  <!-- Orchestrator -->
  <rect x="200" y="42" width="180" height="40" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
  <text x="290" y="62" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="600" font-family="sans-serif">🎯 Orchestrator</text>
  <text x="290" y="75" text-anchor="middle" fill="#2563eb" font-size="7" font-family="sans-serif">Breaks task into pieces</text>

  <!-- Lines to agents -->
  <path d="M250,82 L140,110" stroke="#64748b" stroke-width="1.5" />
  <path d="M290,82 L290,110" stroke="#64748b" stroke-width="1.5" />
  <path d="M330,82 L440,110" stroke="#64748b" stroke-width="1.5" />

  <!-- Researcher -->
  <rect x="40" y="112" width="200" height="50" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
  <text x="140" y="132" text-anchor="middle" fill="#991b1b" font-size="10" font-weight="600" font-family="sans-serif">🔍 Researcher Agent</text>
  <text x="140" y="150" text-anchor="middle" fill="#b91c1c" font-size="7" font-family="sans-serif">Searches web, reads sources, collects facts</text>
  <text x="140" y="163" text-anchor="middle" fill="#64748b" font-size="6.5" font-family="sans-serif">Tool: web_search | Focus: finding information</text>

  <!-- Writer -->
  <rect x="260" y="112" width="200" height="50" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" />
  <text x="360" y="132" text-anchor="middle" fill="#92400e" font-size="10" font-weight="600" font-family="sans-serif">✍️ Writer Agent</text>
  <text x="360" y="150" text-anchor="middle" fill="#b45309" font-size="7" font-family="sans-serif">Turns facts into structured report</text>
  <text x="360" y="163" text-anchor="middle" fill="#64748b" font-size="6.5" font-family="sans-serif">Tool: write_file | Focus: clarity and structure</text>

  <!-- Reviewer -->
  <rect x="480" y="112" width="90" height="50" rx="8" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.5" />
  <text x="525" y="132" text-anchor="middle" fill="#6b21a8" font-size="10" font-weight="600" font-family="sans-serif">✅ Reviewer</text>
  <text x="525" y="150" text-anchor="middle" fill="#7c3aed" font-size="7" font-family="sans-serif">Checks for errors</text>
  <text x="525" y="163" text-anchor="middle" fill="#64748b" font-size="6.5" font-family="sans-serif">Focus: quality</text>

  <!-- Feedback loop -->
  <path d="M525,162 L525,190 L360,190" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2" />
  <polygon points="360,187 367,190 360,193" fill="#f59e0b" />
  <text x="440" y="205" text-anchor="middle" fill="#d97706" font-size="6.5" font-family="sans-serif">↻ Feedback loop: Reviewer sends back to Writer if issues found</text>

  <!-- Why multi-agent -->
  <rect x="15" y="215" width="550" height="12" rx="4" fill="#0f172a" />
  <text x="290" y="224" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="sans-serif">💡 Each agent has its own system prompt, tools, and context window. Parallelism + specialization + error isolation + smaller context per agent.</text>
</svg>