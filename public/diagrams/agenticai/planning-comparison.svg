<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" fill="none">
  <rect x="0" y="0" width="580" height="230" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#92400e">🗺️ Two Approaches to Planning</text>

  <!-- Reactive -->
  <rect x="15" y="40" width="270" height="180" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
  <text x="150" y="60" text-anchor="middle" fill="#991b1b" font-size="10" font-weight="600" font-family="sans-serif">⚡ Reactive (Step-by-Step)</text>
  <text x="150" y="75" text-anchor="middle" fill="#b91c1c" font-size="7" font-family="sans-serif">"Figure it out as you go"</text>

  <rect x="30" y="90" width="240" height="22" rx="4" fill="#0f172a" />
  <text x="150" y="105" text-anchor="middle" fill="#fca5a5" font-size="7" font-family="monospace">1️⃣ Read the error message</text>

  <path d="M150,112 L150,120" stroke="#f87171" stroke-width="1.5" />
  <polygon points="147,120 150,126 153,120" fill="#f87171" />

  <rect x="30" y="128" width="240" height="22" rx="4" fill="#0f172a" />
  <text x="150" y="143" text-anchor="middle" fill="#fca5a5" font-size="7" font-family="monospace">2️⃣ Find the file with the bug</text>

  <path d="M150,150 L150,158" stroke="#f87171" stroke-width="1.5" />
  <polygon points="147,158 150,164 153,158" fill="#f87171" />

  <rect x="30" y="166" width="240" height="22" rx="4" fill="#0f172a" />
  <text x="150" y="181" text-anchor="middle" fill="#fca5a5" font-size="7" font-family="monospace">3️⃣ Edit the line, test again</text>

  <text x="150" y="210" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Good for: simple tasks, debugging</text>

  <!-- Planned -->
  <rect x="295" y="40" width="270" height="180" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="430" y="60" text-anchor="middle" fill="#166534" font-size="10" font-weight="600" font-family="sans-serif">📋 Planned (Divide & Conquer)</text>
  <text x="430" y="75" text-anchor="middle" fill="#15803d" font-size="7" font-family="sans-serif">"Plan first, then execute"</text>

  <!-- Plan phase -->
  <rect x="310" y="88" width="240" height="20" rx="4" fill="#0f172a" />
  <text x="430" y="102" text-anchor="middle" fill="#fcd34d" font-size="7" font-weight="600" font-family="monospace">📝 PLAN: 1. Create folder   2. Write HTML   3. Write CSS   4. Test</text>

  <path d="M430,108 L430,118" stroke="#22c55e" stroke-width="1.5" />
  <polygon points="427,118 430,124 433,118" fill="#22c55e" />

  <rect x="310" y="126" width="75" height="22" rx="4" fill="#1e293b" />
  <text x="347" y="141" text-anchor="middle" fill="#86efac" font-size="6.5" font-family="monospace">1️⃣ mkdir</text>
  <rect x="392" y="126" width="75" height="22" rx="4" fill="#1e293b" />
  <text x="429" y="141" text-anchor="middle" fill="#86efac" font-size="6.5" font-family="monospace">2️⃣ index.html</text>
  <rect x="474" y="126" width="76" height="22" rx="4" fill="#1e293b" />
  <text x="512" y="141" text-anchor="middle" fill="#86efac" font-size="6.5" font-family="monospace">3️⃣ styles.css</text>

  <path d="M347,148 L347,158" stroke="#22c55e" stroke-width="1.5" />
  <polygon points="344,158 347,164 350,158" fill="#22c55e" />

  <rect x="310" y="166" width="240" height="22" rx="4" fill="#0f172a" />
  <text x="430" y="181" text-anchor="middle" fill="#86efac" font-size="7" font-family="monospace">4️⃣ ✅ Open in browser — verify it works</text>

  <text x="430" y="210" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Good for: complex tasks, big projects</text>
</svg>