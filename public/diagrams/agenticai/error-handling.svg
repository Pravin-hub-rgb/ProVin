<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" fill="none">
  <rect x="0" y="0" width="580" height="230" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#991b1b">⚠️ Error Handling — What the API Returns When Things Fail</text>

  <!-- Errors grid -->
  <rect x="15" y="42" width="130" height="80" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1" />
  <text x="80" y="60" text-anchor="middle" fill="#991b1b" font-size="20" font-weight="600" font-family="sans-serif">401</text>
  <text x="80" y="80" text-anchor="middle" fill="#b91c1c" font-size="8" font-weight="600" font-family="sans-serif">🔑 Invalid API Key</text>
  <text x="80" y="95" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Wrong, expired, or</text>
  <text x="80" y="108" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">missing API key</text>
  <text x="80" y="118" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">❌ Don't retry — fix key</text>

  <path d="M145,82 L165,82" stroke="#94a3b8" stroke-width="1" />

  <rect x="168" y="42" width="130" height="80" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1" />
  <text x="233" y="60" text-anchor="middle" fill="#92400e" font-size="20" font-weight="600" font-family="sans-serif">429</text>
  <text x="233" y="80" text-anchor="middle" fill="#b45309" font-size="8" font-weight="600" font-family="sans-serif">⏳ Rate Limited</text>
  <text x="233" y="95" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Too many requests</text>
  <text x="233" y="108" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">too quickly</text>
  <text x="233" y="118" text-anchor="middle" fill="#16a34a" font-size="7" font-family="sans-serif">✅ Wait & retry</text>

  <path d="M298,82 L318,82" stroke="#94a3b8" stroke-width="1" />

  <rect x="321" y="42" width="130" height="80" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1" />
  <text x="386" y="60" text-anchor="middle" fill="#1e40af" font-size="20" font-weight="600" font-family="sans-serif">400</text>
  <text x="386" y="80" text-anchor="middle" fill="#2563eb" font-size="8" font-weight="600" font-family="sans-serif">📋 Bad Request</text>
  <text x="386" y="95" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Invalid parameters,</text>
  <text x="386" y="108" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">prompt too long</text>
  <text x="386" y="118" text-anchor="middle" fill="#f59e0b" font-size="7" font-family="sans-serif">⚠️ Check your params</text>

  <path d="M451,82 L465,82" stroke="#94a3b8" stroke-width="1" />

  <rect x="468" y="42" width="100" height="80" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1" />
  <text x="518" y="60" text-anchor="middle" fill="#6b21a8" font-size="20" font-weight="600" font-family="sans-serif">5xx</text>
  <text x="518" y="80" text-anchor="middle" fill="#7c3aed" font-size="8" font-weight="600" font-family="sans-serif">🌐 Server Error</text>
  <text x="518" y="95" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Network timeout,</text>
  <text x="518" y="108" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">DNS, overload</text>
  <text x="518" y="118" text-anchor="middle" fill="#f59e0b" font-size="7" font-family="sans-serif">⚠️ Log & report</text>

  <!-- Code example -->
  <rect x="15" y="137" width="550" height="85" rx="6" fill="#0f172a" />
  <text x="30" y="155" fill="#fcd34d" font-size="8" font-weight="600" font-family="monospace">try {</text>
  <text x="45" y="170" fill="#86efac" font-size="8" font-family="monospace">  const message = await client.messages.create({ ... });</text>
  <text x="45" y="185" fill="#86efac" font-size="8" font-family="monospace">  return message.content[0].text;</text>
  <text x="30" y="200" fill="#fcd34d" font-size="8" font-weight="600" font-family="monospace">} catch (error) {</text>
  <text x="45" y="213" fill="#fca5a5" font-size="8" font-family="monospace">  if (error.status === 401) return "Invalid API key";</text>
  <text x="45" y="225" fill="#fca5a5" font-size="8" font-family="monospace">  if (error.status === 429) { wait(5s); retry(); }</text>
  <text x="30" y="225" fill="#fcd34d" font-size="8" font-weight="600" font-family="monospace">}</text>
</svg>