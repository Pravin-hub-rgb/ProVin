<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" fill="none">
  <rect x="0" y="0" width="580" height="250" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#92400e">🔄 The Agent Loop: Think → Act → Observe (ReAct Pattern)</text>

  <!-- Cycle arrows -->
  <path d="M290,55 A95,95 0 1,1 289,55" fill="none" stroke="#f59e0b" stroke-width="2" />
  <polygon points="385,50 393,55 385,60" fill="#f59e0b" />

  <!-- Think -->
  <rect x="220" y="50" width="140" height="50" rx="25" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
  <text x="290" y="72" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="600" font-family="sans-serif">🤔 Think</text>
  <text x="290" y="88" text-anchor="middle" fill="#2563eb" font-size="7" font-family="sans-serif">"What should I do next?"</text>

  <!-- arrow down -->
  <path d="M290,100 L290,120" stroke="#93c5fd" stroke-width="2" />
  <polygon points="287,120 290,127 293,120" fill="#93c5fd" />

  <!-- Act -->
  <rect x="220" y="128" width="140" height="50" rx="25" fill="#fef2f2" stroke="#f87171" stroke-width="2" />
  <text x="290" y="150" text-anchor="middle" fill="#991b1b" font-size="10" font-weight="600" font-family="sans-serif">⚡ Act</text>
  <text x="290" y="166" text-anchor="middle" fill="#b91c1c" font-size="7" font-family="sans-serif">Call a tool (read, write, run)</text>

  <!-- arrow down -->
  <path d="M290,178 L290,190" stroke="#f87171" stroke-width="2" />
  <polygon points="287,190 290,197 293,190" fill="#f87171" />

  <!-- Observe -->
  <rect x="220" y="190" width="140" height="50" rx="25" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
  <text x="290" y="212" text-anchor="middle" fill="#166534" font-size="10" font-weight="600" font-family="sans-serif">👁️ Observe</text>
  <text x="290" y="228" text-anchor="middle" fill="#15803d" font-size="7" font-family="sans-serif">Read the result, learn from it</text>

  <!-- Curved arrow back up (observe to think) -->
  <path d="M220,215 C190,215 190,75 220,75" fill="none" stroke="#22c55e" stroke-width="2" />
  <polygon points="220,72 213,75 220,78" fill="#22c55e" />
  <text x="178" y="148" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif" transform="rotate(-90,178,148)">Loop repeats until goal is met</text>

  <!-- Concrete example -->
  <rect x="380" y="50" width="185" height="185" rx="6" fill="#0f172a" />
  <text x="472" y="70" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="600" font-family="sans-serif">Dark/Light Theme Example</text>

  <rect x="390" y="80" width="165" height="22" rx="4" fill="#1e293b" />
  <text x="472" y="94" text-anchor="middle" fill="#93c5fd" font-size="7" font-family="monospace">🤔 Think: "Read CSS first"</text>

  <rect x="390" y="107" width="165" height="22" rx="4" fill="#1e293b" />
  <text x="472" y="121" text-anchor="middle" fill="#fca5a5" font-size="7" font-family="monospace">⚡ Act: read_file styles.css</text>

  <rect x="390" y="134" width="165" height="22" rx="4" fill="#1e293b" />
  <text x="472" y="148" text-anchor="middle" fill="#86efac" font-size="7" font-family="monospace">👁️ Observe: got file contents</text>

  <rect x="390" y="166" width="165" height="22" rx="4" fill="#1e293b" />
  <text x="472" y="180" text-anchor="middle" fill="#93c5fd" font-size="7" font-family="monospace">🤔 Think: "Add CSS variables"</text>

  <rect x="390" y="193" width="165" height="22" rx="4" fill="#1e293b" />
  <text x="472" y="207" text-anchor="middle" fill="#fca5a5" font-size="7" font-family="monospace">⚡ Act: write_file styles.css</text>

  <rect x="390" y="220" width="165" height="15" rx="3" fill="#7c3aed" />
  <text x="472" y="231" text-anchor="middle" fill="#c4b5fd" font-size="6" font-family="sans-serif">...continues until task is done</text>
</svg>