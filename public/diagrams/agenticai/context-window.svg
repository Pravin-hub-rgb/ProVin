<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" fill="none">
  <rect x="0" y="0" width="580" height="270" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5" />
  <text x="290" y="28" text-anchor="middle" font-size="14" font-weight="600" font-family="sans-serif" fill="#3730a3">📐 Context Window — The Model's Desk</text>

  <!-- The context window box -->
  <rect x="40" y="45" width="500" height="190" rx="8" fill="#fff" stroke="#6366f1" stroke-width="2" />
  <text x="290" y="62" text-anchor="middle" font-size="10" font-weight="600" font-family="sans-serif" fill="#4338ca">Context Window (max ~200K tokens)</text>

  <!-- System prompt -->
  <rect x="55" y="72" width="470" height="26" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1" />
  <text x="65" y="89" fill="#92400e" font-size="8" font-weight="600" font-family="monospace">📌 System prompt</text>
  <text x="500" y="89" text-anchor="end" fill="#92400e" font-size="7" font-family="sans-serif">~500 tokens</text>
  <text x="160" y="89" fill="#b45309" font-size="7" font-family="sans-serif">"You are an expert web developer..." (always present)</text>

  <!-- Attached file -->
  <rect x="55" y="104" width="470" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" />
  <text x="65" y="121" fill="#1e40af" font-size="8" font-weight="600" font-family="monospace">📄 Attached file</text>
  <text x="500" y="121" text-anchor="end" fill="#1e40af" font-size="7" font-family="sans-serif">~900 tokens</text>
  <text x="160" y="121" fill="#2563eb" font-size="7" font-family="sans-serif">styles.css (your project's CSS file)</text>

  <!-- Conversation history -->
  <rect x="55" y="136" width="470" height="26" rx="4" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1" />
  <text x="65" y="153" fill="#9d174d" font-size="8" font-weight="600" font-family="monospace">💬 Conversation history</text>
  <text x="500" y="153" text-anchor="end" fill="#9d174d" font-size="7" font-family="sans-serif">~1,100 tokens</text>
  <text x="160" y="153" fill="#db2777" font-size="7" font-family="sans-serif">Your follow-ups + model's responses (growing)</text>

  <!-- Current message -->
  <rect x="55" y="168" width="470" height="26" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="65" y="185" fill="#166534" font-size="8" font-weight="600" font-family="monospace">📝 Current message</text>
  <text x="500" y="185" text-anchor="end" fill="#166534" font-size="7" font-family="sans-serif">~15 tokens</text>
  <text x="160" y="185" fill="#15803d" font-size="7" font-family="sans-serif">"Create a dark theme and a light theme"</text>

  <!-- Falling off -->
  <rect x="55" y="200" width="470" height="22" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1" stroke-dasharray="4,2" />
  <text x="65" y="215" fill="#991b1b" font-size="8" font-weight="600" font-family="monospace">⚠️ Pushed out</text>
  <text x="500" y="215" text-anchor="end" fill="#991b1b" font-size="7" font-family="sans-serif">Oldest content gone</text>
  <text x="160" y="215" fill="#dc2626" font-size="7" font-family="sans-serif">Earlier instructions or file contents — model can no longer see these</text>

  <!-- Arrow showing push direction -->
  <path d="M55,213 L40,220" stroke="#dc2626" stroke-width="1.5" />
  <path d="M525,213 L540,220" stroke="#dc2626" stroke-width="1.5" />
  <text x="290" y="250" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">As conversation grows, oldest content gets pushed out — the model "forgets" because those tokens are no longer in the window</text>
</svg>