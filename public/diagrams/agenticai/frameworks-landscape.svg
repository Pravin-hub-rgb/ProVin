<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" fill="none">
  <rect x="0" y="0" width="580" height="220" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#7c3aed">🏗️ Agentic AI Frameworks — Pre-Built Scaffolding</text>

  <!-- LangChain -->
  <rect x="15" y="42" width="260" height="80" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="145" y="62" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="600" font-family="sans-serif">🔗 LangChain</text>
  <text x="145" y="80" text-anchor="middle" fill="#2563eb" font-size="8" font-family="sans-serif">The OG — first to abstract LLM calls,</text>
  <text x="145" y="95" text-anchor="middle" fill="#2563eb" font-size="8" font-family="sans-serif">agents, tools, memory into one framework</text>
  <text x="145" y="112" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Powerful but complex. API has changed multiple times.</text>

  <!-- LangGraph -->
  <rect x="305" y="42" width="260" height="80" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="435" y="62" text-anchor="middle" fill="#166534" font-size="11" font-weight="600" font-family="sans-serif">🔀 LangGraph</text>
  <text x="435" y="80" text-anchor="middle" fill="#15803d" font-size="8" font-family="sans-serif">By LangChain team — models agents as</text>
  <text x="435" y="95" text-anchor="middle" fill="#15803d" font-size="8" font-family="sans-serif">a graph of nodes (steps) + edges (flow)</text>
  <text x="435" y="112" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Excellent for branching, looping, complex workflows</text>

  <!-- CrewAI -->
  <rect x="15" y="132" width="260" height="80" rx="8" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.5" />
  <text x="145" y="152" text-anchor="middle" fill="#6b21a8" font-size="11" font-weight="600" font-family="sans-serif">👥 CrewAI</text>
  <text x="145" y="170" text-anchor="middle" fill="#7c3aed" font-size="8" font-family="sans-serif">Multi-agent framework. Define a "crew"</text>
  <text x="145" y="185" text-anchor="middle" fill="#7c3aed" font-size="8" font-family="sans-serif">with roles, goals, backstories</text>
  <text x="145" y="202" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Researcher + Writer + Reviewer = blog post</text>

  <!-- AutoGen -->
  <rect x="305" y="132" width="260" height="80" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" />
  <text x="435" y="152" text-anchor="middle" fill="#92400e" font-size="11" font-weight="600" font-family="sans-serif">🤖 AutoGen</text>
  <text x="435" y="170" text-anchor="middle" fill="#b45309" font-size="8" font-family="sans-serif">By Microsoft — agents that converse</text>
  <text x="435" y="185" text-anchor="middle" fill="#b45309" font-size="8" font-family="sans-serif">with each other to solve tasks</text>
  <text x="435" y="202" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Great for debate, negotiation, agent-to-agent</text>
</svg>