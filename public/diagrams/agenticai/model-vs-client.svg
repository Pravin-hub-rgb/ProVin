<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" fill="none">
  <rect x="0" y="0" width="580" height="230" rx="10" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5" />
  <text x="290" y="28" text-anchor="middle" font-size="14" font-weight="600" font-family="sans-serif" fill="#0369a1">🏗️ Client vs Model — The Architecture</text>

  <!-- Client side (Your Computer) -->
  <rect x="15" y="45" width="250" height="165" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
  <text x="140" y="68" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="600" font-family="sans-serif">💻 Your Computer</text>
  <text x="140" y="85" text-anchor="middle" fill="#b91c1c" font-size="9" font-family="sans-serif">The Client (Cline, opencode, etc.)</text>

  <rect x="30" y="100" width="220" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="140" y="118" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600" font-family="sans-serif">What the Client Does</text>
  <rect x="40" y="128" width="95" height="20" rx="4" fill="#1e293b" />
  <text x="87" y="142" text-anchor="middle" fill="#fca5a5" font-size="7.5" font-family="monospace">📂 Reads your files</text>
  <rect x="145" y="128" width="95" height="20" rx="4" fill="#1e293b" />
  <text x="192" y="142" text-anchor="middle" fill="#fca5a5" font-size="7.5" font-family="monospace">✏️ Writes your code</text>
  <rect x="40" y="153" width="95" height="20" rx="4" fill="#1e293b" />
  <text x="87" y="167" text-anchor="middle" fill="#fca5a5" font-size="7.5" font-family="monospace">⚡ Runs commands</text>
  <rect x="145" y="153" width="95" height="20" rx="4" fill="#1e293b" />
  <text x="192" y="167" text-anchor="middle" fill="#fca5a5" font-size="7.5" font-family="monospace">🌐 Calls the API</text>

  <!-- Arrow from client to model -->
  <path d="M265,120 L300,120" stroke="#f59e0b" stroke-width="2" />
  <text x="282" y="110" text-anchor="middle" fill="#d97706" font-size="7" font-family="sans-serif">API</text>
  <text x="282" y="138" text-anchor="middle" fill="#d97706" font-size="7" font-family="sans-serif">call</text>
  <polygon points="300,116 310,120 300,124" fill="#f59e0b" />

  <!-- Model side (Provider's Server) -->
  <rect x="315" y="45" width="250" height="165" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="440" y="68" text-anchor="middle" fill="#166534" font-size="13" font-weight="600" font-family="sans-serif">☁️ Provider's Server</text>
  <text x="440" y="85" text-anchor="middle" fill="#15803d" font-size="9" font-family="sans-serif">The Model (DeepSeek, Claude, Gemini, etc.)</text>

  <rect x="330" y="100" width="220" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="440" y="118" text-anchor="middle" fill="#86efac" font-size="9" font-weight="600" font-family="sans-serif">What the Model Does</text>
  <rect x="340" y="128" width="95" height="20" rx="4" fill="#1e293b" />
  <text x="387" y="142" text-anchor="middle" fill="#86efac" font-size="7.5" font-family="monospace">📖 Reads input text</text>
  <rect x="445" y="128" width="95" height="20" rx="4" fill="#1e293b" />
  <text x="492" y="142" text-anchor="middle" fill="#86efac" font-size="7.5" font-family="monospace">🧠 Predicts tokens</text>
  <rect x="340" y="153" width="95" height="20" rx="4" fill="#1e293b" />
  <text x="387" y="167" text-anchor="middle" fill="#86efac" font-size="7.5" font-family="monospace">📤 Returns text</text>
  <rect x="445" y="153" width="95" height="20" rx="4" fill="#1e293b" />
  <text x="492" y="167" text-anchor="middle" fill="#86efac" font-size="7.5" font-family="monospace">❌ Cannot act</text>

  <!-- Arrow back from model to client -->
  <path d="M550,120 L565,120" stroke="#f59e0b" stroke-width="2" opacity="0" />

  <text x="440" y="225" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">The client sends your request to the model. The model predicts text and sends it back. The client acts on it.</text>
</svg>