<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" fill="none">
  <rect x="0" y="0" width="580" height="220" rx="10" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#be185d">🌡️ Temperature: The Creativity Dial</text>

  <!-- The spectrum bar -->
  <rect x="30" y="50" width="520" height="30" rx="15" fill="url(#tempGrad)" />
  <defs>
    <linearGradient id="tempGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="33%" stop-color="#8b5cf6" />
      <stop offset="66%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Labels on the bar -->
  <text x="60" y="102" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="600" font-family="sans-serif">0</text>
  <text x="60" y="116" text-anchor="middle" fill="#1e40af" font-size="7" font-family="sans-serif">Deterministic</text>

  <text x="180" y="102" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="600" font-family="sans-serif">0.3</text>
  <text x="180" y="116" text-anchor="middle" fill="#6d28d9" font-size="7" font-family="sans-serif">Coding default</text>

  <text x="300" y="102" text-anchor="middle" fill="#92400e" font-size="10" font-weight="600" font-family="sans-serif">0.7</text>
  <text x="300" y="116" text-anchor="middle" fill="#92400e" font-size="7" font-family="sans-serif">Balanced</text>

  <text x="420" y="102" text-anchor="middle" fill="#991b1b" font-size="10" font-weight="600" font-family="sans-serif">1.0</text>
  <text x="420" y="116" text-anchor="middle" fill="#991b1b" font-size="7" font-family="sans-serif">Creative</text>

  <text x="530" y="102" text-anchor="middle" fill="#7f1d1d" font-size="10" font-weight="600" font-family="sans-serif">&gt;1.0</text>
  <text x="530" y="116" text-anchor="middle" fill="#7f1d1d" font-size="7" font-family="sans-serif">Unstable</text>

  <!-- Example boxes -->
  <rect x="10" y="135" width="180" height="75" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="100" y="152" text-anchor="middle" fill="#1e40af" font-size="8" font-weight="600" font-family="sans-serif">🎯 Low (0-0.3) — Precision</text>
  <text x="100" y="167" text-anchor="middle" fill="#2563eb" font-size="7" font-family="sans-serif">"The cat sat on the mat"</text>
  <text x="100" y="182" text-anchor="middle" fill="#2563eb" font-size="7" font-family="sans-serif">— always the same answer</text>
  <text x="100" y="197" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Coding, data extraction, facts</text>

  <rect x="200" y="135" width="180" height="75" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1" />
  <text x="290" y="152" text-anchor="middle" fill="#92400e" font-size="8" font-weight="600" font-family="sans-serif">⚖️ Medium (0.4-0.7) — Balanced</text>
  <text x="290" y="167" text-anchor="middle" fill="#b45309" font-size="7" font-family="sans-serif">"The cat sat on the rug"</text>
  <text x="290" y="182" text-anchor="middle" fill="#b45309" font-size="7" font-family="sans-serif">— different but reasonable</text>
  <text x="290" y="197" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Conversation, docs, ideas</text>

  <rect x="390" y="135" width="180" height="75" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="480" y="152" text-anchor="middle" fill="#991b1b" font-size="8" font-weight="600" font-family="sans-serif">🎨 High (0.7-1.0) — Creative</text>
  <text x="480" y="167" text-anchor="middle" fill="#dc2626" font-size="7" font-family="sans-serif">"The cat sat on a cloud"</text>
  <text x="480" y="182" text-anchor="middle" fill="#dc2626" font-size="7" font-family="sans-serif">— surprising, unpredictable</text>
  <text x="480" y="197" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Brainstorming, poetry, variety</text>
</svg>