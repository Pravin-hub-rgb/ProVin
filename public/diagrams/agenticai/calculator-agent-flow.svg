<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" fill="none">
  <rect x="0" y="0" width="580" height="240" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#92400e">🧮 Calculator Agent — The Full Tool Calling Flow</text>

  <!-- Step 1 -->
  <rect x="15" y="42" width="170" height="55" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="100" y="60" text-anchor="middle" fill="#1e40af" font-size="9" font-weight="600" font-family="sans-serif">1️⃣ You send a prompt</text>
  <text x="100" y="78" text-anchor="middle" fill="#2563eb" font-size="8" font-family="sans-serif">"What is 144 × 37 + 12?"</text>
  <text x="100" y="92" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">+ tool definition for calculator</text>

  <path d="M185,70 L205,70" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="205,67 212,70 205,73" fill="#f59e0b" />

  <!-- Step 2 -->
  <rect x="215" y="42" width="170" height="55" rx="6" fill="#0f172a" />
  <text x="300" y="60" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="600" font-family="sans-serif">2️⃣ Model says "tool_use"</text>
  <text x="300" y="78" text-anchor="middle" fill="#fbbf24" font-size="7" font-family="monospace">{ name: "calculator",</text>
  <text x="300" y="92" text-anchor="middle" fill="#fbbf24" font-size="7" font-family="monospace">  input: { expression: "144 * 37 + 12" } }</text>

  <path d="M385,70 L405,70" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="405,67 412,70 405,73" fill="#f59e0b" />

  <!-- Step 3 -->
  <rect x="415" y="42" width="150" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
  <text x="490" y="60" text-anchor="middle" fill="#92400e" font-size="9" font-weight="600" font-family="sans-serif">3️⃣ Your code</text>
  <text x="490" y="78" text-anchor="middle" fill="#b45309" font-size="8" font-weight="600" font-family="sans-serif">⚡ runs eval()</text>
  <text x="490" y="92" text-anchor="middle" fill="#92400e" font-size="7" font-family="sans-serif">Returns "5340"</text>

  <!-- Arrow going back down -->
  <path d="M490,97 L490,125 L100,125" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2" />
  <polygon points="100,121 107,125 100,129" fill="#f59e0b" />
  <text x="300" y="118" text-anchor="middle" fill="#d97706" font-size="7" font-family="sans-serif">⬅️ Send result back to model</text>

  <!-- Step 4 -->
  <rect x="15" y="133" width="250" height="55" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
  <text x="140" y="151" text-anchor="middle" fill="#991b1b" font-size="9" font-weight="600" font-family="sans-serif">4️⃣ Second API call with result</text>
  <text x="140" y="169" text-anchor="middle" fill="#b91c1c" font-size="7" font-family="sans-serif">Messages: [user prompt, assistant tool_use,</text>
  <text x="140" y="183" text-anchor="middle" fill="#b91c1c" font-size="7" font-family="sans-serif">tool_result with "5340"]</text>

  <path d="M265,160 L285,160" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="285,157 292,160 285,163" fill="#f59e0b" />

  <!-- Step 5 -->
  <rect x="295" y="133" width="270" height="55" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="430" y="151" text-anchor="middle" fill="#166534" font-size="9" font-weight="600" font-family="sans-serif">5️⃣ Model reads result → Final answer</text>
  <text x="430" y="169" text-anchor="middle" fill="#15803d" font-size="8" font-family="sans-serif">"144 × 37 + 12 equals 5,340"</text>
  <text x="430" y="183" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">The model never did the math — your code did!</text>

  <!-- Key insight -->
  <rect x="15" y="203" width="550" height="30" rx="6" fill="#0f172a" />
  <text x="290" y="223" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">💡 The model never touches your filesystem. It outputs JSON instructions. Your code executes them. The model is the brain; your code is the body.</text>
</svg>