<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" fill="none">
  <rect x="0" y="0" width="580" height="240" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#166534">🔧 The Tool Calling Loop — The Engine of Every Agent</text>

  <!-- User -->
  <rect x="10" y="45" width="100" height="40" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" />
  <text x="60" y="62" text-anchor="middle" fill="#1e40af" font-size="8" font-weight="600" font-family="sans-serif">👤 User</text>
  <text x="60" y="76" text-anchor="middle" fill="#2563eb" font-size="7" font-family="sans-serif">sends a prompt</text>

  <path d="M110,65 L135,65" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="135,62 142,65 135,68" fill="#f59e0b" />

  <!-- Step 1: Model decides -->
  <rect x="144" y="45" width="140" height="40" rx="6" fill="#0f172a" />
  <text x="214" y="60" text-anchor="middle" fill="#fcd34d" font-size="7" font-weight="600" font-family="monospace">1️⃣ Model receives prompt</text>
  <text x="214" y="75" text-anchor="middle" fill="#fbbf24" font-size="7" font-family="monospace">+ tool definitions</text>

  <path d="M284,65 L310,65" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="310,62 317,65 310,68" fill="#f59e0b" />

  <!-- Decision diamond -->
  <rect x="319" y="45" width="125" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
  <text x="381" y="60" text-anchor="middle" fill="#92400e" font-size="7" font-weight="600" font-family="sans-serif">2️⃣ Model decides:</text>
  <text x="381" y="75" text-anchor="middle" fill="#92400e" font-size="7" font-family="sans-serif">Text answer or tool?</text>

  <!-- Text answer branch -->
  <path d="M444,65 L470,65" stroke="#22c55e" stroke-width="1.5" />
  <polygon points="470,62 477,65 470,68" fill="#22c55e" />
  <rect x="479" y="45" width="90" height="40" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="524" y="60" text-anchor="middle" fill="#166534" font-size="7" font-weight="600" font-family="sans-serif">✅ Text answer</text>
  <text x="524" y="75" text-anchor="middle" fill="#15803d" font-size="7" font-family="sans-serif">Return to user</text>

  <!-- Tool call branch - goes down -->
  <path d="M381,85 L381,105" stroke="#ef4444" stroke-width="1.5" />
  <polygon points="378,105 381,112 384,105" fill="#ef4444" />
  <text x="395" y="100" fill="#dc2626" font-size="7" font-weight="600" font-family="sans-serif">Tool call</text>

  <!-- Loop body -->
  <rect x="310" y="114" width="140" height="40" rx="6" fill="#0f172a" />
  <text x="380" y="128" text-anchor="middle" fill="#fca5a5" font-size="7" font-weight="600" font-family="monospace">3️⃣ Your code executes</text>
  <text x="380" y="143" text-anchor="middle" fill="#fca5a5" font-size="7" font-weight="600" font-family="monospace">the tool function</text>

  <path d="M380,154 L380,170" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="377,170 380,177 383,170" fill="#f59e0b" />

  <rect x="310" y="179" width="140" height="40" rx="6" fill="#0f172a" />
  <text x="380" y="193" text-anchor="middle" fill="#86efac" font-size="7" font-weight="600" font-family="monospace">4️⃣ Result sent back</text>
  <text x="380" y="208" text-anchor="middle" fill="#86efac" font-size="7" font-weight="600" font-family="monospace">to the model</text>

  <!-- Loop arrow back to step 2 -->
  <path d="M310,199 C250,199 214,170 214,85" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2" />
  <polygon points="214,82 209,89 219,89" fill="#f59e0b" />
  <text x="240" y="142" text-anchor="middle" fill="#d97706" font-size="7" font-family="sans-serif">↻ Loop back</text>

  <!-- Summary at bottom -->
  <rect x="10" y="225" width="560" height="12" rx="4" fill="#f0fdf4" />
  <text x="290" y="234" text-anchor="middle" fill="#166534" font-size="7" font-family="sans-serif">💡 This while-loop is the same pattern used by Cline, opencode, and every AI coding tool. The model leads; your code follows.</text>
</svg>