<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" fill="none">
  <rect x="0" y="0" width="580" height="230" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="290" y="25" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#1e293b">🧰 Tools Available to Agents</text>

  <!-- Tool grid -->
  <rect x="15" y="42" width="175" height="55" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
  <text x="102" y="60" text-anchor="middle" fill="#1e40af" font-size="9" font-weight="600" font-family="sans-serif">📂 Read/Write Files</text>
  <text x="102" y="75" text-anchor="middle" fill="#2563eb" font-size="7" font-family="sans-serif">Create, edit, delete files</text>
  <text x="102" y="88" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">How Cline writes your code</text>

  <rect x="200" y="42" width="175" height="55" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1" />
  <text x="287" y="60" text-anchor="middle" fill="#991b1b" font-size="9" font-weight="600" font-family="sans-serif">⚡ Run Commands</text>
  <text x="287" y="75" text-anchor="middle" fill="#b91c1c" font-size="7" font-family="sans-serif">Execute shell commands</text>
  <text x="287" y="88" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">npm install, git commit, etc.</text>

  <rect x="385" y="42" width="180" height="55" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="475" y="60" text-anchor="middle" fill="#166534" font-size="9" font-weight="600" font-family="sans-serif">🌐 Search the Web</text>
  <text x="475" y="75" text-anchor="middle" fill="#15803d" font-size="7" font-family="sans-serif">Find live information</text>
  <text x="475" y="88" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Research, docs, APIs</text>

  <rect x="15" y="105" width="175" height="55" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1" />
  <text x="102" y="123" text-anchor="middle" fill="#92400e" font-size="9" font-weight="600" font-family="sans-serif">📡 Call APIs</text>
  <text x="102" y="138" text-anchor="middle" fill="#b45309" font-size="7" font-family="sans-serif">HTTP requests to services</text>
  <text x="102" y="151" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Send emails, post to Slack</text>

  <rect x="200" y="105" width="175" height="55" rx="6" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1" />
  <text x="287" y="123" text-anchor="middle" fill="#6b21a8" font-size="9" font-weight="600" font-family="sans-serif">🌍 Browse Web Pages</text>
  <text x="287" y="138" text-anchor="middle" fill="#7c3aed" font-size="7" font-family="sans-serif">Click, fill forms, read</text>
  <text x="287" y="151" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Test your app, scrape data</text>

  <rect x="385" y="105" width="180" height="55" rx="6" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1" />
  <text x="475" y="123" text-anchor="middle" fill="#9d174d" font-size="9" font-weight="600" font-family="sans-serif">🗃️ Query Databases</text>
  <text x="475" y="138" text-anchor="middle" fill="#be185d" font-size="7" font-family="sans-serif">Run SQL queries</text>
  <text x="475" y="151" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Pull data, generate reports</text>

  <!-- Every tool has three parts -->
  <rect x="15" y="175" width="550" height="45" rx="6" fill="#0f172a" />
  <text x="30" y="192" fill="#94a3b8" font-size="8" font-family="sans-serif">Every tool has three parts:</text>
  <rect x="200" y="183" width="60" height="25" rx="4" fill="#1e293b" />
  <text x="230" y="199" text-anchor="middle" fill="#fca5a5" font-size="7" font-family="monospace">📛 Name</text>
  <text x="265" y="199" fill="#64748b" font-size="7" font-family="sans-serif">→</text>
  <rect x="275" y="183" width="100" height="25" rx="4" fill="#1e293b" />
  <text x="325" y="199" text-anchor="middle" fill="#fcd34d" font-size="7" font-family="monospace">📋 Parameters</text>
  <text x="380" y="199" fill="#64748b" font-size="7" font-family="sans-serif">→</text>
  <rect x="390" y="183" width="75" height="25" rx="4" fill="#1e293b" />
  <text x="427" y="199" text-anchor="middle" fill="#86efac" font-size="7" font-family="monospace">🔙 Return value</text>
</svg>