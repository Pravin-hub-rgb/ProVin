<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#a855f7"/>
    </marker>
    <marker id="arrow4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="900" height="320" fill="url(#bg)" rx="8"/>

  <!-- Code line -->
  <rect x="30" y="20" width="840" height="50" rx="6" fill="#1e293b"/>
  <text x="50" y="52" font-size="18" font-weight="600" font-family="monospace" fill="#e2e8f0">function getFirst&lt;</text>
  <text x="297" y="52" font-size="18" font-weight="600" font-family="monospace" fill="#fbbf24">T</text>
  <text x="310" y="52" font-size="18" font-weight="600" font-family="monospace" fill="#e2e8f0">&gt;(arr: </text>
  <text x="445" y="52" font-size="18" font-weight="600" font-family="monospace" fill="#60a5fa">T</text>
  <text x="460" y="52" font-size="18" font-weight="600" font-family="monospace" fill="#e2e8f0">[]): </text>
  <text x="560" y="52" font-size="18" font-weight="600" font-family="monospace" fill="#a855f7">T</text>
  <text x="575" y="52" font-size="18" font-weight="600" font-family="monospace" fill="#e2e8f0"> | undefined {</text>

  <!-- Arrow 1 — pointing to <T> -->
  <path d="M200,100 C200,150 250,120 297,100" stroke="#fbbf24" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
  <text x="200" y="130" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#fbbf24">generic type parameter</text>

  <!-- Arrow 2 — pointing to arr: T[] -->
  <path d="M380,100 C380,150 430,120 460,100" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <text x="380" y="130" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#60a5fa">parameter: T ka array</text>

  <!-- Arrow 3 — pointing to T | undefined -->
  <path d="M560,100 C560,150 610,120 610,100" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>
  <text x="610" y="130" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#a855f7">return type: T ya undefined</text>

  <!-- Divider line -->
  <line x1="30" y1="170" x2="870" y2="170" stroke="#334155" stroke-width="1"/>

  <!-- Second code line: getFirst<number>(...) -->
  <rect x="30" y="190" width="840" height="50" rx="6" fill="#1e293b"/>
  <text x="50" y="222" font-size="18" font-weight="600" font-family="monospace" fill="#e2e8f0">getFirst&lt;</text>
  <text x="156" y="222" font-size="18" font-weight="600" font-family="monospace" fill="#22c55e">number</text>
  <text x="260" y="222" font-size="18" font-weight="600" font-family="monospace" fill="#e2e8f0">&gt;([10, 20, 30])</text>

  <!-- Arrow 4 — pointing to <number> -->
  <path d="M156,270 C156,300 200,280 200,260" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrow4)"/>
  <text x="156" y="290" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#22c55e">explicit: T = number</text>
</svg>
