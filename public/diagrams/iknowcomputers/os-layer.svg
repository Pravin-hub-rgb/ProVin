<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" fill="none">
  <rect x="0" y="0" width="520" height="240" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5" />
  <text x="260" y="28" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#0369a1">🧩 OS Layer — The Bridge Between Hardware and Software</text>

  <rect x="60" y="50" width="400" height="40" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="260" y="68" text-anchor="middle" fill="#166534" font-size="11" font-weight="600" font-family="sans-serif">📱 Application Layer — MS Word, Chrome, VLC, Games</text>
  <text x="260" y="82" text-anchor="middle" fill="#15803d" font-size="8" font-family="sans-serif">You use this software directly</text>

  <path d="M160,90 L160,108" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" />
  <path d="M260,90 L260,108" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" />
  <path d="M360,90 L360,108" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" />

  <rect x="60" y="110" width="400" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
  <text x="260" y="128" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700" font-family="sans-serif">⚙️ Operating System (OS)</text>
  <text x="260" y="143" text-anchor="middle" fill="#b45309" font-size="9" font-family="sans-serif">Resource Manager — CPU, RAM, Storage, Devices are all controlled from here</text>

  <path d="M160,150 L160,168" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" />
  <path d="M260,150 L260,168" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" />
  <path d="M360,150 L360,168" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" />

  <rect x="60" y="170" width="400" height="50" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
  <text x="260" y="190" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600" font-family="sans-serif">🖥️ Hardware Layer — CPU, RAM, Storage, GPU, I/O</text>
  <text x="260" y="205" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">Physical components — the OS manages these</text>

  <rect x="45" y="45" width="430" height="180" rx="10" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="5,3" />
</svg>