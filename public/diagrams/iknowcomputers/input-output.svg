<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" fill="none">
  <rect x="0" y="0" width="580" height="220" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5" />
  <text x="290" y="28" text-anchor="middle" font-size="14" font-weight="600" font-family="sans-serif" fill="#92400e">🔄 Input → Processing → Output</text>

  <rect x="15" y="50" width="150" height="140" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="90" y="72" text-anchor="middle" fill="#166534" font-size="11" font-weight="600" font-family="sans-serif">📥 Input Devices</text>
  <text x="90" y="85" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">(Tum → Computer)</text>
  <rect x="30" y="95" width="120" height="20" rx="4" fill="#1e293b" />
  <text x="90" y="109" text-anchor="middle" fill="#22c55e" font-size="9" font-family="sans-serif">⌨️ Keyboard</text>
  <rect x="30" y="120" width="120" height="20" rx="4" fill="#1e293b" />
  <text x="90" y="134" text-anchor="middle" fill="#22c55e" font-size="9" font-family="sans-serif">🖱️ Mouse</text>
  <rect x="30" y="145" width="120" height="20" rx="4" fill="#1e293b" />
  <text x="90" y="159" text-anchor="middle" fill="#22c55e" font-size="9" font-family="sans-serif">🎤 Microphone</text>
  <rect x="30" y="170" width="120" height="14" rx="4" fill="#1e293b" />
  <text x="90" y="180" text-anchor="middle" fill="#22c55e" font-size="8" font-family="sans-serif">📷 Camera</text>

  <path d="M165,120 L200,120" stroke="#f59e0b" stroke-width="2" />
  <polygon points="200,116 210,120 200,124" fill="#f59e0b" />

  <rect x="210" y="65" width="140" height="110" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
  <rect x="225" y="80" width="110" height="35" rx="4" fill="#0f172a" />
  <text x="280" y="98" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="600" font-family="monospace">💻 CPU</text>
  <text x="280" y="112" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="sans-serif">Processes data</text>
  <rect x="225" y="122" width="110" height="35" rx="4" fill="#0f172a" />
  <text x="280" y="138" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="600" font-family="monospace">🧠 RAM</text>
  <text x="280" y="150" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="sans-serif">Temporary store</text>
  <rect x="210" y="175" width="140" height="4" rx="2" fill="#334155" />

  <path d="M350,120 L385,120" stroke="#f59e0b" stroke-width="2" />
  <polygon points="385,116 395,120 385,124" fill="#f59e0b" />

  <rect x="395" y="50" width="170" height="140" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
  <text x="480" y="72" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="600" font-family="sans-serif">📤 Output Devices</text>
  <text x="480" y="85" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">(Computer → Tum)</text>
  <rect x="410" y="95" width="140" height="20" rx="4" fill="#1e293b" />
  <text x="480" y="109" text-anchor="middle" fill="#f87171" font-size="9" font-family="sans-serif">🖥️ Monitor</text>
  <rect x="410" y="120" width="140" height="20" rx="4" fill="#1e293b" />
  <text x="480" y="134" text-anchor="middle" fill="#f87171" font-size="9" font-family="sans-serif">🖨️ Printer</text>
  <rect x="410" y="145" width="140" height="20" rx="4" fill="#1e293b" />
  <text x="480" y="159" text-anchor="middle" fill="#f87171" font-size="9" font-family="sans-serif">🔊 Speakers</text>
  <rect x="410" y="170" width="140" height="14" rx="4" fill="#1e293b" />
  <text x="480" y="180" text-anchor="middle" fill="#f87171" font-size="8" font-family="sans-serif">📽️ Projector</text>
