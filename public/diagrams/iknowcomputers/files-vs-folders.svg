<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" fill="none">
  <rect x="0" y="0" width="560" height="200" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5" />
  <text x="280" y="28" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#92400e">📁 Files vs Folders — Container and Items</text>

