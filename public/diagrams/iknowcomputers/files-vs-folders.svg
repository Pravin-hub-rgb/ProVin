  <rect x="45" y="60" width="150" height="20" rx="3" fill="#312e81" />
  <text x="120" y="74" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600" font-family="sans-serif">📁 Office Work</text>

  <rect x="50" y="90" width="140" height="20" rx="3" fill="#334155" />
  <text x="120" y="104" text-anchor="middle" fill="#93c5fd" font-size="8" font-family="monospace">📄 report.docx</text>

  <rect x="50" y="114" width="140" height="20" rx="3" fill="#334155" />
  <text x="120" y="128" text-anchor="middle" fill="#fca5a5" font-size="8" font-family="monospace">🖼 photo.jpg</text>

  <rect x="50" y="138" width="140" height="20" rx="3" fill="#334155" />
  <text x="120" y="152" text-anchor="middle" fill="#86efac" font-size="8" font-family="monospace">📊 data.xlsx</text>

  <text x="280" y="118" text-anchor="middle" fill="#94a3b8" font-size="20" font-weight="600" font-family="sans-serif">=</text>

  <rect x="320" y="55" width="100" height="120" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
  <text x="370" y="80" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600" font-family="sans-serif">📁 Folder</text>
  <text x="370" y="100" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">Container</text>
  <text x="370" y="120" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">(Directory)</text>

  <rect x="440" y="55" width="100" height="120" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
  <text x="490" y="80" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600" font-family="sans-serif">📄 File</text>
