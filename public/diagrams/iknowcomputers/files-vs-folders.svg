  <text x="490" y="120" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">(Single Unit)</text>

  <text x="280" y="188" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">💡 A folder can hold any number of files and folders inside it</text>
