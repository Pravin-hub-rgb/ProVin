<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" fill="none">
  <rect x="0" y="0" width="560" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="280" y="28" text-anchor="middle" font-size="13" font-weight="600" font-family="sans-serif" fill="#1e293b">🖥️ Hardware vs 💿 Software</text>

  <rect x="15" y="50" width="250" height="130" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
  <text x="140" y="75" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="600" font-family="sans-serif">🖥️ Hardware</text>
  <text x="140" y="95" text-anchor="middle" fill="#b91c1c" font-size="10" font-family="sans-serif">Body — Physical</text>
  <rect x="30" y="108" width="55" height="20" rx="4" fill="#fecaca" />
  <text x="57" y="122" text-anchor="middle" fill="#7f1d1d" font-size="8" font-weight="600" font-family="monospace">CPU</text>
  <rect x="92" y="108" width="55" height="20" rx="4" fill="#fecaca" />
  <text x="119" y="122" text-anchor="middle" fill="#7f1d1d" font-size="8" font-weight="600" font-family="monospace">RAM</text>
  <rect x="155" y="108" width="55" height="20" rx="4" fill="#fecaca" />
  <text x="182" y="122" text-anchor="middle" fill="#7f1d1d" font-size="8" font-weight="600" font-family="monospace">HDD</text>
  <rect x="60" y="135" width="160" height="20" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="140" y="149" text-anchor="middle" fill="#991b1b" font-size="9" font-family="sans-serif">⛔ Without software — just a paperweight</text>

  <text x="290" y="118" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="600" font-family="sans-serif">VS</text>

  <rect x="295" y="50" width="250" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="420" y="75" text-anchor="middle" fill="#166534" font-size="13" font-weight="600" font-family="sans-serif">💿 Software</text>
  <text x="420" y="95" text-anchor="middle" fill="#15803d" font-size="10" font-family="sans-serif">Soul — Instructions</text>
  <rect x="310" y="108" width="100" height="20" rx="4" fill="#bbf7d0" />
  <text x="360" y="122" text-anchor="middle" fill="#14532d" font-size="8" font-weight="600" font-family="monospace">Windows OS</text>
  <rect x="420" y="108" width="110" height="20" rx="4" fill="#bbf7d0" />
  <text x="475" y="122" text-anchor="middle" fill="#14532d" font-size="8" font-weight="600" font-family="monospace">MS Word</text>
  <rect x="350" y="135" width="160" height="20" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="430" y="149" text-anchor="middle" fill="#166534" font-size="9" font-family="sans-serif">✅ Without hardware — nothing works</text>

  <text x="280" y="188" text-anchor="middle" fill="#6366f1" font-size="11" font-family="sans-serif">⚡ Together they make a computer — one body, one soul</text>
</svg>