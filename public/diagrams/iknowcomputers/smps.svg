<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 240">
  <rect width="550" height="240" fill="#faf5ff" rx="8" stroke="#e9d5ff" stroke-width="1.5"/>
  
  <text x="275" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">SMPS — Power Supply Unit (PSU)</text>
  
  <!-- SMPS Box -->
  <rect x="125" y="45" width="300" height="100" rx="8" fill="#1e293b"/>
  <text x="275" y="72" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">SMPS (Switch Mode Power Supply)</text>
  
  <!-- Fan icon -->
  <circle cx="275" cy="105" r="18" fill="#334155" stroke="#6366f1" stroke-width="1.5"/>
  <text x="275" y="109" font-family="sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">FAN</text>
  
  <!-- Power In -->
  <rect x="30" y="60" width="80" height="35" rx="4" fill="#334155"/>
  <text x="70" y="75" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">AC Input</text>
  <text x="70" y="88" font-family="monospace" font-size="7" fill="#94a3b8" text-anchor="middle">230V from wall</text>
  
  <!-- Power to components arrows -->
  <line x1="110" y1="70" x2="125" y2="70" stroke="#6366f1" stroke-width="2"/>
  <line x1="425" y1="75" x2="500" y2="60" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="425" y1="85" x2="500" y2="95" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="425" y1="95" x2="500" y2="130" stroke="#f59e0b" stroke-width="1.5"/>
  
  <!-- Output labels -->
  <text x="505" y="63" font-family="monospace" font-size="8" fill="#22c55e">+12V → CPU / GPU</text>
  <text x="505" y="98" font-family="monospace" font-size="8" fill="#3b82f6">+5V → USB / Drive</text>
  <text x="505" y="133" font-family="monospace" font-size="8" fill="#f59e0b">+3.3V → Chipset</text>

  <!-- Wattage ratings -->
  <rect x="150" y="162" width="110" height="30" rx="4" fill="#334155"/>
  <text x="205" y="180" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">450W (Office PC)</text>
  
  <rect x="290" y="162" width="110" height="30" rx="4" fill="#334155"/>
  <text x="345" y="180" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">600W+ (Gaming PC)</text>

  <text x="275" y="210" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Always choose a PSU with higher wattage than your system needs — leaves room for upgrades</text>
  
  <text x="275" y="233" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">80+ Bronze / Gold / Platinum = efficiency rating (higher = less electricity wasted as heat)</text>
</svg>