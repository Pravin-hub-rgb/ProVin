<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 240">
  <rect width="550" height="240" fill="#fef3c7" rx="8" stroke="#fde68a" stroke-width="1.5"/>
  
  <text x="275" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">UPS — Uninterruptible Power Supply</text>
  
  <!-- Wall power -->
  <rect x="20" y="55" width="100" height="60" rx="6" fill="#334155"/>
  <text x="70" y="78" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">Wall Power</text>
  <text x="70" y="95" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">230V AC</text>
  
  <line x1="120" y1="85" x2="150" y2="85" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="135" y="80" font-family="sans-serif" font-size="8" fill="#6366f1" text-anchor="middle">⚡</text>
  
  <!-- UPS box -->
  <rect x="150" y="45" width="120" height="110" rx="8" fill="#1e293b"/>
  <text x="210" y="68" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">UPS</text>
  <text x="210" y="85" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Battery inside</text>
  
  <rect x="160" y="95" width="100" height="25" rx="4" fill="#334155"/>
  <text x="210" y="112" font-family="monospace" font-size="8" fill="#f8fafc" text-anchor="middle">600VA / 1000VA</text>
  
  <text x="210" y="145" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Switch time: 2-10ms</text>
  
  <line x1="270" y1="85" x2="300" y2="85" stroke="#22c55e" stroke-width="2"/>
  
  <!-- Computer -->
  <rect x="300" y="55" width="100" height="60" rx="6" fill="#334155"/>
  <text x="350" y="78" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">Computer</text>
  <text x="350" y="95" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Protected!</text>

  <!-- Ratings -->
  <rect x="30" y="135" width="250" height="40" rx="6" fill="#1e293b"/>
  <text x="155" y="153" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">600VA = ~10 min backup for office PC</text>
  <text x="155" y="168" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">1000VA = ~20 min backup for PC + monitor</text>
  
  <!-- What UPS protects -->
  <rect x="300" y="135" width="230" height="55" rx="6" fill="#1e293b"/>
  <text x="415" y="152" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">Why you need a UPS</text>
  <text x="415" y="168" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">1. Save work when power cuts</text>
  <text x="415" y="182" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">2. Prevent hardware damage</text>

  <text x="275" y="233" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">UPS ≠ stabilizer. UPS also gives battery backup; stabilizer only regulates voltage.</text>
</svg>