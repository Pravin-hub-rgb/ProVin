  <rect x="210" y="108" width="90" height="22" rx="4" fill="#1e293b" />
  <text x="255" y="123" text-anchor="middle" fill="#22c55e" font-size="11" font-family="monospace">3.5 GHz</text>
  <text x="255" y="145" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="sans-serif">The more GHz, the faster it is</text>
