  <rect x="45" y="150" width="90" height="20" rx="3" fill="#312e81" />
  <text x="90" y="164" text-anchor="middle" fill="#c7d2fe" font-size="9" font-weight="600" font-family="sans-serif">🔲 Processor Chip</text>
  <path d="M150,120 L170,120" stroke="#f59e0b" stroke-width="2" />
