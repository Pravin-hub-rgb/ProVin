<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" fill="none">
  <rect x="0" y="0" width="540" height="210" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" />
  <text x="20" y="28" font-size="14" font-weight="600" font-family="sans-serif" fill="#7c3aed">🧠 CPU — Central Processing Unit</text>
