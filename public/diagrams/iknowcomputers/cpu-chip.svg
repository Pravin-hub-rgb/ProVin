  <rect x="30" y="65" width="120" height="115" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
  <rect x="45" y="78" width="90" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="90" y="97" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600" font-family="monospace">Core 1</text>
  <rect x="45" y="113" width="90" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
