<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" fill="none">
  <rect x="0" y="0" width="500" height="130" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5" />
  <text x="20" y="30" font-size="16" font-family="sans-serif" fill="currentColor">🧑‍💻 "The world's first programmer"</text>
  <text x="20" y="55" fill="#475569" font-size="12" font-family="sans-serif">Ada wrote the first algorithm for Babbage's</text>
  <text x="20" y="73" fill="#475569" font-size="12" font-family="sans-serif">Analytical Engine. Algorithm = step-by-step</text>
  <text x="20" y="91" fill="#475569" font-size="12" font-family="sans-serif">instructions. That's why she is considered the</text>
  <text x="20" y="109" fill="#475569" font-size="12" font-family="sans-serif">first programmer.</text>
  <rect x="330" y="18" width="155" height="90" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1" />
  <text x="407" y="42" text-anchor="middle" fill="#854d0e" font-size="11" font-weight="600" font-family="sans-serif">💡 Fun Fact</text>
  <text x="407" y="62" text-anchor="middle" fill="#854d0e" font-size="10" font-family="sans-serif">Ada Lovelace Day</text>
  <text x="407" y="78" text-anchor="middle" fill="#854d0e" font-size="10" font-family="sans-serif">every year in October</text>
  <text x="407" y="94" text-anchor="middle" fill="#854d0e" font-size="10" font-family="sans-serif">is celebrated</text>
</svg>
