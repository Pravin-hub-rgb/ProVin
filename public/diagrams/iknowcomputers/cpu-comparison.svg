<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 240">
  <rect width="550" height="240" fill="#faf5ff" rx="8" stroke="#e9d5ff" stroke-width="1.5"/>
  
  <text x="275" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">CPU Comparison — Intel vs AMD</text>
  
  <!-- Intel section -->
  <rect x="20" y="42" width="245" height="178" rx="6" fill="#1e293b"/>
  <text x="142" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#93c5fd" text-anchor="middle">Intel Core Series</text>
  
  <rect x="30" y="75" width="110" height="55" rx="4" fill="#334155"/>
  <text x="85" y="94" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">i3</text>
  <text x="85" y="112" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Entry-level</text>
  <text x="85" y="124" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">2-4 cores</text>

  <rect x="150" y="75" width="110" height="55" rx="4" fill="#334155"/>
  <text x="205" y="94" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">i5</text>
  <text x="205" y="112" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Mid-range</text>
  <text x="205" y="124" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">4-6 cores</text>

  <rect x="30" y="140" width="110" height="55" rx="4" fill="#334155"/>
  <text x="85" y="159" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">i7</text>
  <text x="85" y="177" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">High-end</text>
  <text x="85" y="189" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">6-8 cores</text>

  <rect x="150" y="140" width="110" height="55" rx="4" fill="#334155"/>
  <text x="205" y="159" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">i9</text>
  <text x="205" y="177" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Enthusiast</text>
  <text x="205" y="189" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">8-16 cores</text>

  <!-- AMD section -->
  <rect x="285" y="42" width="245" height="178" rx="6" fill="#1e293b"/>
  <text x="407" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">AMD Ryzen Series</text>

  <rect x="295" y="75" width="110" height="55" rx="4" fill="#334155"/>
  <text x="350" y="94" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">Ryzen 3</text>
  <text x="350" y="112" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Entry-level</text>
  <text x="350" y="124" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">4 cores</text>

  <rect x="415" y="75" width="110" height="55" rx="4" fill="#334155"/>
  <text x="470" y="94" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">Ryzen 5</text>
  <text x="470" y="112" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Mid-range</text>
  <text x="470" y="124" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">6 cores</text>

  <rect x="295" y="140" width="110" height="55" rx="4" fill="#334155"/>
  <text x="350" y="159" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">Ryzen 7</text>
  <text x="350" y="177" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">High-end</text>
  <text x="350" y="189" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">8 cores</text>

  <rect x="415" y="140" width="110" height="55" rx="4" fill="#334155"/>
  <text x="470" y="159" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">Ryzen 9</text>
  <text x="470" y="177" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Enthusiast</text>
  <text x="470" y="189" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">12-16 cores</text>

  <text x="275" y="233" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">More cores = more programs can run simultaneously without slowing down</text>
</svg>