<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 240">
  <rect width="550" height="240" fill="#fef3c7" rx="8" stroke="#fde68a" stroke-width="1.5"/>
  
  <text x="275" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">GPU — Integrated vs Dedicated Graphics</text>
  
  <!-- Integrated -->
  <rect x="20" y="45" width="245" height="175" rx="6" fill="#1e293b"/>
  <text x="142" y="68" font-family="sans-serif" font-size="12" font-weight="bold" fill="#93c5fd" text-anchor="middle">Integrated Graphics</text>
  
  <rect x="30" y="80" width="225" height="25" rx="4" fill="#334155"/>
  <text x="142" y="97" font-family="monospace" font-size="9" fill="#f8fafc" text-anchor="middle">Built inside the CPU</text>
  
  <rect x="30" y="112" width="225" height="25" rx="4" fill="#334155"/>
  <text x="142" y="129" font-family="monospace" font-size="9" fill="#f8fafc" text-anchor="middle">Shares RAM with system</text>
  
  <rect x="30" y="144" width="225" height="25" rx="4" fill="#334155"/>
  <text x="142" y="161" font-family="monospace" font-size="9" fill="#f8fafc" text-anchor="middle">Low power consumption</text>
  
  <rect x="30" y="176" width="225" height="25" rx="4" fill="#334155"/>
  <text x="142" y="193" font-family="monospace" font-size="9" fill="#f8fafc" text-anchor="middle">Good for: Office, browsing, movies</text>

  <text x="142" y="215" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Most office laptops use this — enough for daily work</text>

  <!-- Dedicated -->
  <rect x="285" y="45" width="245" height="175" rx="6" fill="#1e293b"/>
  <text x="407" y="68" font-family="sans-serif" font-size="12" font-weight="bold" fill="#22c55e" text-anchor="middle">Dedicated GPU (Graphics Card)</text>
  
  <rect x="295" y="80" width="225" height="25" rx="4" fill="#334155"/>
  <text x="407" y="97" font-family="monospace" font-size="9" fill="#f8fafc" text-anchor="middle">Separate card with its own RAM (VRAM)</text>
  
  <rect x="295" y="112" width="225" height="25" rx="4" fill="#334155"/>
  <text x="407" y="129" font-family="monospace" font-size="9" fill="#f8fafc" text-anchor="middle">High performance — 20-50x faster</text>
  
  <rect x="295" y="144" width="225" height="25" rx="4" fill="#334155"/>
  <text x="407" y="161" font-family="monospace" font-size="9" fill="#f8fafc" text-anchor="middle">Needs extra power from SMPS</text>
  
  <rect x="295" y="176" width="225" height="25" rx="4" fill="#334155"/>
  <text x="407" y="193" font-family="monospace" font-size="9" fill="#f8fafc" text-anchor="middle">Good for: Gaming, video editing, AI</text>

  <text x="407" y="215" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Brands: NVIDIA (GeForce) / AMD (Radeon)</text>

  <text x="275" y="233" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Office work does NOT need a dedicated GPU — integrated is perfectly fine</text>
</svg>