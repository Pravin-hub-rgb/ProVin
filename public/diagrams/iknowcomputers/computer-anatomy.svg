<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" fill="none">
  <rect x="15" y="15" width="370" height="250" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <rect x="35" y="35" width="330" height="100" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
  <text x="200" y="55" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600" font-family="sans-serif">MOTHERBOARD — Connects all parts together</text>
  <rect x="55" y="65" width="100" height="50" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
  <rect x="62" y="70" width="86" height="38" rx="2" fill="#1e1b4b" />
  <text x="105" y="88" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600" font-family="monospace">CPU</text>
  <text x="105" y="100" text-anchor="middle" fill="#93c5fd" font-size="7" font-family="sans-serif">Processor</text>
  <rect x="170" y="65" width="80" height="22" rx="3" fill="#312e81" />
  <text x="210" y="81" text-anchor="middle" fill="#f8fafc" font-size="8" font-weight="600" font-family="monospace">RAM</text>
  <rect x="170" y="91" width="80" height="22" rx="3" fill="#312e81" />
  <text x="210" y="107" text-anchor="middle" fill="#f8fafc" font-size="8" font-weight="600" font-family="monospace">RAM</text>
  <text x="210" y="120" text-anchor="middle" fill="#93c5fd" font-size="7" font-family="sans-serif">2 sticks = dual channel</text>
  <rect x="270" y="65" width="80" height="50" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
  <text x="310" y="85" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600" font-family="sans-serif">GPU</text>
  <text x="310" y="100" text-anchor="middle" fill="#fde68a" font-size="7" font-family="sans-serif">Graphics</text>
  <text x="310" y="110" text-anchor="middle" fill="#fde68a" font-size="7" font-family="sans-serif">(optional)</text>
  <rect x="55" y="150" width="140" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="125" y="172" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600" font-family="sans-serif">💾 Storage</text>
  <rect x="62" y="180" width="55" height="18" rx="3" fill="#0ea5e9" />
  <text x="89" y="193" text-anchor="middle" fill="#f0f9ff" font-size="8" font-weight="600" font-family="monospace">SSD</text>
  <rect x="125" y="180" width="55" height="18" rx="3" fill="#64748b" />
  <text x="152" y="193" text-anchor="middle" fill="#f8fafc" font-size="8" font-weight="600" font-family="monospace">HDD</text>
  <rect x="210" y="150" width="155" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="287" y="172" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600" font-family="sans-serif">⚡ Power Supply</text>
  <rect x="250" y="183" width="80" height="16" rx="3" fill="#78350f" />
  <text x="290" y="195" text-anchor="middle" fill="#fef3c7" font-size="8" font-weight="600" font-family="monospace">PSU</text>
  <rect x="55" y="220" width="310" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="210" y="237" text-anchor="middle" fill="#22c55e" font-size="9" font-family="monospace">🔗 Data flow: CPU ↔ RAM ↔ Storage ↔ Everything</text>
  <text x="210" y="247" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">The motherboard keeps everything connected</text>

  <text x="420" y="35" font-weight="600" fill="#6366f1" font-size="13" font-family="sans-serif">🧠 Computer Anatomy</text>
  <rect x="410" y="50" width="190" height="26" rx="4" fill="#1e1b4b" />
  <text x="505" y="67" text-anchor="middle" fill="#c7d2fe" font-size="11" font-family="sans-serif">CPU — Brain (calculations)</text>
  <rect x="410" y="82" width="190" height="26" rx="4" fill="#1e1b4b" />
  <text x="505" y="99" text-anchor="middle" fill="#c7d2fe" font-size="11" font-family="sans-serif">RAM — Table (current work)</text>
  <rect x="410" y="114" width="190" height="26" rx="4" fill="#1e1b4b" />
  <text x="505" y="131" text-anchor="middle" fill="#c7d2fe" font-size="11" font-family="sans-serif">Storage — Keep everything here</text>
  <rect x="410" y="146" width="190" height="26" rx="4" fill="#1e1b4b" />
  <text x="505" y="163" text-anchor="middle" fill="#c7d2fe" font-size="11" font-family="sans-serif">Motherboard — Backbone</text>
  <rect x="410" y="178" width="190" height="26" rx="4" fill="#1e1b4b" />
  <text x="505" y="195" text-anchor="middle" fill="#c7d2fe" font-size="11" font-family="sans-serif">PSU — Electricity manager</text>
  <rect x="410" y="215" width="195" height="42" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1" />
  <text x="507" y="233" text-anchor="middle" fill="#0369a1" font-size="10" font-weight="600" font-family="sans-serif">💡 Simple Analogy</text>
  <text x="507" y="250" text-anchor="middle" fill="#0369a1" font-size="9" font-family="sans-serif">Brain + Desk + Almirah = Computer</text>
</svg>